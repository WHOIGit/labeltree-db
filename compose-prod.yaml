services:

  web:
    image: ${IMAGE:?set IMAGE, e.g. registry.example.org/amplify/labeltree-db:latest}
    # Behind Apache (config/apache2/): reachable from the host only, so every
    # request passes the proxy, which sets X-Forwarded-For and -Proto.
    command: ./start-django
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # collectstatic writes here on start; Apache serves it as /static/.
      - /opt/labeltree/static:/app/staticfiles
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    volumes:
      - ./vols/db:/var/lib/postgresql
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
