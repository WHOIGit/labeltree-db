<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>labeltree-db web app mockup</title>
  <!-- Spec: webapp-mockup-spec.md. Self-contained apart from the two CDN links. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    :root {
      --lt-bg: #f3f6f9;
      --lt-line: #e4e9ef;
      --lt-muted: #687384;
      --lt-blue: #1f6feb;
      --lt-new: #e3f4e8;
      --lt-new-line: #198754;
      --lt-bump: #fff4cc;
      --lt-bump-line: #d4a106;
      --lt-hover: #e8f0fe;
    }
    html, body { height: 100%; background: var(--lt-bg); font-size: 14px; }
    body { overflow: hidden; }
    [x-cloak] { display: none !important; }

    .shell { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.25rem;
      padding: .5rem 1rem; background: #fff; border-bottom: 1px solid var(--lt-line);
    }
    .topbar .brand { font-weight: 600; margin-right: .5rem; }
    .topbar .field { display: flex; align-items: center; gap: .4rem; }
    .topbar .field > .k { color: var(--lt-muted); }
    .topbar .form-select { width: auto; }
    .main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; min-height: 0; }
    .panel { display: flex; flex-direction: column; min-height: 0; background: #fff; }
    .panel + .panel { border-left: 1px solid var(--lt-line); }
    .panel-head {
      display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem;
      border-bottom: 1px solid var(--lt-line);
    }
    .panel-head h2 { font-size: 1rem; margin: 0; }
    .scroll { overflow: auto; min-height: 0; flex: 1; }

    /* tree rows */
    .trow {
      display: flex; align-items: center; gap: .35rem; height: 28px; padding-right: .5rem;
      white-space: nowrap; cursor: default; border-left: 3px solid transparent;
    }
    .trow:hover { background: #f6f8fa; }
    .trow .caret {
      width: 18px; border: 0; background: none; padding: 0; color: var(--lt-muted); line-height: 1;
    }
    .trow .nk { color: var(--lt-muted); font-size: .8em; }
    .trow .kebab {
      border: 0; background: none; width: 18px; height: 22px; padding: 0; margin-left: -4px; border-radius: 4px;
      color: var(--lt-muted); font-weight: 700; line-height: 1;
    }
    .trow .kebab:hover { background: #e6ebf1; color: #000; }
    .trow.hit .lbl { background: #fff3a8; }
    .trow.mark-new { background: var(--lt-new); border-left-color: var(--lt-new-line); }
    .trow.mark-bump { background: var(--lt-bump); border-left-color: var(--lt-bump-line); }
    .trow.mark-dep .lbl { text-decoration: line-through; color: #8a939f; }
    .trow.mark-dep { border-left: 3px dashed #adb5bd; }
    .trow.hl { outline: 2px solid var(--lt-blue); outline-offset: -2px; }
    .picking .trow.pickable { cursor: crosshair; }
    .picking .trow.pickable:hover { background: var(--lt-hover); }
    .picking .trow.unpickable { opacity: .4; }
    .badge.b-worms { background: #e0f2f1; color: #00695c; text-decoration: none; font-weight: 500; }
    .badge.b-worms:hover { background: #b2dfdb; }
    .badge.b-warn { background: #fff0c2; color: #8a5a00; font-weight: 600; cursor: help; }
    .badge.b-new { background: var(--lt-new-line); }
    .badge.b-bump { background: var(--lt-bump-line); }
    .badge.b-dep { background: #adb5bd; }
    .pick-banner {
      display: flex; align-items: center; gap: .5rem; padding: .4rem .75rem;
      background: var(--lt-hover); border-bottom: 1px solid #c6d7f5;
    }

    /* node menu */
    .node-menu { position: fixed; z-index: 1060; min-width: 220px; }
    .node-menu .dropdown-item.disabled { pointer-events: auto; cursor: not-allowed; }
    .node-menu .hint { font-size: .75em; color: var(--lt-muted); }

    /* changes */
    .summary { padding: .5rem .75rem; border-bottom: 1px solid var(--lt-line); font-size: .85rem; }
    .crow { padding: .3rem .75rem; border-bottom: 1px solid #f0f2f5; display: flex; gap: .4rem; align-items: baseline; }
    .crow:hover { background: var(--lt-hover); cursor: pointer; }
    .crow .seq { color: var(--lt-muted); width: 2.2em; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
    .crow .txt { flex: 1; word-break: break-word; }
    .crow .x { border: 0; background: none; color: var(--lt-muted); padding: 0 .25rem; }
    .crow .x:hover { color: #b42318; }
    .group-head {
      display: flex; align-items: center; gap: .4rem; padding: .35rem .75rem;
      background: #f3f5f8; border-bottom: 1px solid var(--lt-line); font-weight: 600; cursor: pointer;
    }
    .group-body .crow { padding-left: 1.5rem; }
    .op { font-size: .7rem; width: 4.8rem; text-align: center; flex: none; }
    .op-add { background: #198754; }
    .op-edit { background: #0d6efd; }
    .op-move { background: #6f42c1; }
    .op-deprecate { background: #6c757d; }
    .chk { font-size: .8rem; margin-top: .1rem; }
    .chk.err { color: #b42318; }
    .chk.warn { color: #8a5a00; }
    .notes { border-top: 1px solid var(--lt-line); padding: .5rem .75rem; }

    /* modals (Alpine-driven, Bootstrap styles) */
    .modal.d-block { background: rgba(20, 30, 40, .35); }
    .picker { max-height: 220px; overflow: auto; border: 1px solid var(--lt-line); border-radius: .375rem; }
    .picker label { display: flex; gap: .5rem; padding: .2rem .5rem; margin: 0; }
    .picker label:hover { background: #f6f8fa; }
    .picker .path { color: var(--lt-muted); font-size: .8em; margin-left: auto; }
    .review { font-size: .85rem; border: 1px solid var(--lt-line); border-radius: .375rem; }
    .toasts { position: fixed; right: 1rem; bottom: 1rem; z-index: 1100; display: grid; gap: .5rem; }

    /* AphiaID pills: grey never fetched, green, orange ! warnings, red ? unknown_aphia */
    .pill { position: relative; display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border-radius: 50%; text-decoration: none; font-size: 12px; line-height: 1; }
    .pill-green { background: #d1f0dc; } .pill-orange { background: #ffd8a8; }
    .pill-red { background: #ffc9c9; } .pill-grey { background: #e3e6ea; filter: grayscale(1); }
    .pill .pb { position: absolute; top: -4px; right: -5px; min-width: 13px; height: 13px; border-radius: 7px;
                font-size: 9px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: center; }
    .pill-orange .pb { background: #e8590c; } .pill-red .pb { background: #c92a2a; }
    /* changes panel tabs */
    .tabs { display: flex; flex-wrap: wrap; gap: .1rem; padding: .3rem .5rem 0; border-bottom: 1px solid var(--lt-line); }
    .tabs button { border: 1px solid transparent; border-bottom: 0; background: none; padding: .25rem .5rem; font-size: .8rem;
                   border-radius: .3rem .3rem 0 0; color: var(--lt-muted); }
    .tabs button.active { border-color: var(--lt-line); background: #fff; color: #000; margin-bottom: -1px; }
    .tabs .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--lt-blue); margin-left: .25rem; }
    .stale { opacity: .45; } .stale-note { font-size: .8rem; color: #8a5a00; background: #fff8e1; padding: .25rem .75rem; }
    /* job progress */
    .job { padding: .5rem .75rem; border-bottom: 1px solid var(--lt-line); font-size: .8rem; }
    .job .progress { height: 8px; margin: .2rem 0 .4rem; }
    .main.with-warnings { grid-template-columns: 280px minmax(0, 1fr) 440px; }
    .mock-note { font-size: .75rem; color: var(--lt-muted); }
  </style>
</head>
<body x-data="app" x-init="init()" @keydown.escape.window="onEscape()">
<div class="shell" x-cloak>

  <!-- ===================== Top bar ===================== -->
  <header class="topbar">
    <span class="brand">labeltree</span>

    <div class="field">
      <span class="k">Tree:</span>
      <select class="form-select form-select-sm" :disabled="mode !== 'static'"
              :title="mode !== 'static' ? 'Leave edit mode to switch trees' : ''"
              @change="selectTree($event.target.value)">
        <template x-for="t in treeList" :key="t.id">
          <option :value="t.id" :selected="t.id === treeId"
                  x-text="t.id + (t.revs.length ? '' : ' (no revisions)')"></option>
        </template>
      </select>
    </div>

    <div class="field">
      <span class="k" x-text="mode === 'static' ? 'Revision:' : 'Base revision:'"></span>
      <template x-if="mode === 'static' && latest > 0">
        <select class="form-select form-select-sm" @change="selectRev($event.target.value)">
          <template x-for="o in revList" :key="o.rev">
            <option :value="o.rev" :selected="o.rev === viewRev" x-text="o.text"></option>
          </template>
        </select>
      </template>
      <template x-if="mode === 'static' && latest === 0"><span class="text-muted">none yet</span></template>
      <template x-if="mode === 'edit'">
        <strong x-text="cs.base_rev ?? 'none (first revision)'"></strong>
      </template>
    </div>

    <div class="field" x-show="mode === 'edit'">
      <span class="k">Draft:</span>
      <strong x-text="cs?.id ? '#' + cs.id : 'new'"></strong>
    </div>

    <div class="field">
      <span class="k">Status:</span>
      <span class="badge" :class="status.cls" x-text="status.text"></span>
    </div>

    <span class="flex-grow-1"></span>

    <!-- Static mode buttons -->
    <template x-if="mode === 'static' && role === 'anonymous'">
      <button class="btn btn-sm btn-primary" @click="toast('The real app goes to the login page')">Log in to edit</button>
    </template>
    <template x-if="mode === 'static' && role !== 'anonymous'">
      <div class="d-flex gap-2">
        <div class="dropdown" x-data="{ open: false }" @click.outside="open = false">
          <button class="btn btn-sm btn-primary dropdown-toggle" @click="open = !open"
                  :disabled="!has('drafter')" :title="has('drafter') ? '' : 'Needs drafter role'">Edit</button>
          <div class="dropdown-menu dropdown-menu-end" :class="{ show: open }" style="right: 0; min-width: 300px">
            <button class="dropdown-item" @click="open = false; startNewDraft()"
                    x-text="latest ? 'New draft from revision ' + latest : 'New draft (first revision)'"></button>
            <template x-if="openDrafts.length">
              <div>
                <hr class="dropdown-divider">
                <h6 class="dropdown-header">Open drafts</h6>
                <template x-for="d in openDrafts" :key="d.id">
                  <button class="dropdown-item" @click="open = false; openDraft(d.id)">
                    <span x-text="'#' + d.id"></span>
                    <small class="text-muted" x-text="'base ' + (d.base_rev ?? 'none') + ' · ' + d.author + ' · ' + d.changes.length + ' changes'"></small>
                  </button>
                </template>
              </div>
            </template>
            <template x-if="discardedDrafts.length">
              <div>
                <hr class="dropdown-divider">
                <h6 class="dropdown-header">Discarded drafts (read-only)</h6>
                <template x-for="d in discardedDrafts" :key="d.id">
                  <button class="dropdown-item text-muted" @click="open = false; openDraft(d.id)">
                    <span x-text="'#' + d.id"></span>
                    <small x-text="'base ' + (d.base_rev ?? 'none') + ' · ' + d.author + ' · ' + d.changes.length + ' changes'"></small>
                  </button>
                </template>
              </div>
            </template>
          </div>
        </div>
        <div class="dropdown" x-data="{ open: false }" @click.outside="open = false">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle" @click="open = !open">WoRMS sync</button>
          <div class="dropdown-menu dropdown-menu-end p-2" :class="{ show: open }" style="right: 0; min-width: 300px">
            <template x-if="sync">
              <div class="small mb-2"><strong>Running:</strong> <span x-text="sync.kind + ' · ' + sync.done + ' of ' + sync.total"></span>
                <div class="progress" style="height: 8px"><div class="progress-bar" :style="'width:' + (100 * sync.done / sync.total) + '%'"></div></div></div>
            </template>
            <button class="dropdown-item" :class="{ disabled: !has('drafter') || sync }" :title="has('drafter') ? '' : 'Needs drafter role'"
                    @click="open = false; startSync('sync_new')">Sync new AphiaIDs</button>
            <button class="dropdown-item" :class="{ disabled: !has('drafter') || sync }" :title="has('drafter') ? '' : 'Needs drafter role'"
                    @click="open = false; startSync('sync_tree')">Sync this tree</button>
            <button class="dropdown-item disabled" title="Site admins only">Full cache sync</button>
            <div class="small text-muted mt-1">Syncs refresh cached WoRMS records and re-check warnings. Cron runs them nightly.</div>
          </div>
        </div>
        <div class="dropdown" x-data="{ open: false }" @click.outside="open = false">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle" @click="open = !open"
                  :disabled="!has('owner')" :title="has('owner') ? 'Start a new tree, as a draft' : 'Needs owner role'">New tree</button>
          <div class="dropdown-menu dropdown-menu-end" :class="{ show: open }" style="right: 0">
            <button class="dropdown-item" @click="open = false; openClone('empty')">Empty tree…</button>
            <button class="dropdown-item" @click="open = false; openClone('import')">From an import file…</button>
            <button class="dropdown-item" :class="{ disabled: latest === 0 }" @click="open = false; openClone('clone')"
                    x-text="'From this revision (' + viewRev + ')…'"></button>
          </div>
        </div>
        <button class="btn btn-sm btn-link" @click="openOrg()">AMPLIfy members</button>
        <button class="btn btn-sm btn-link" @click="openSetup()" title="What a site admin sees on a new instance">New-instance setup</button>
      </div>
    </template>

    <!-- Edit mode buttons -->
    <template x-if="mode === 'edit'">
      <div class="d-flex gap-2">
        <template x-if="!frozen">
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-primary" @click="validate()" :disabled="!!validateBlock" :title="validateBlock">Validate</button>
            <button class="btn btn-sm btn-primary" @click="saveDraft()" :disabled="!!saveBlock" :title="saveBlock">Save Draft</button>
            <button class="btn btn-sm btn-success" @click="openPublish()" :disabled="!!publishBlock" :title="publishBlock">Publish Revision</button>
            <button class="btn btn-sm btn-outline-danger" @click="discardDraft()" :disabled="!cs.id"
                    :title="cs.id ? '' : 'Nothing saved to discard'">Discard Draft</button>
          </div>
        </template>
        <button class="btn btn-sm btn-outline-secondary" @click="exitEdit()">Exit</button>
      </div>
    </template>

    <div class="field border-start ps-3">
      <span class="k mock-note">Mock role:</span>
      <select class="form-select form-select-sm" x-model="role" @change="refresh()">
        <option value="anonymous">anonymous</option>
        <option value="reader">reader</option>
        <option value="drafter">drafter</option>
        <option value="approver">approver</option>
        <option value="owner">owner</option>
      </select>
    </div>
  </header>

  <div class="main" :class="{ 'with-warnings': warningsOpen }">
    <!-- ===================== Warnings panel ===================== -->
    <template x-if="warningsOpen">
      <section class="panel">
        <div class="panel-head"><h2>WoRMS warnings</h2><span class="flex-grow-1"></span>
          <small class="text-muted" x-text="warningRows.length + ' nodes'"></small></div>
        <div class="scroll">
          <template x-for="w in warningRows" :key="w.key">
            <div class="crow" @mouseenter="hover = [w.id]" @mouseleave="hover = []" @click="reveal(w.id)">
              <div class="txt"><div x-text="w.label"></div><div class="chk warn" x-text="w.text"></div></div>
            </div>
          </template>
        </div>
      </section>
    </template>
    <!-- ===================== Tree panel ===================== -->
    <section class="panel">
      <div class="panel-head">
        <h2>Tree</h2>
        <input class="form-control form-control-sm" style="max-width: 260px" placeholder="Filter labels and aliases…"
               x-model="filter" @input.debounce.150ms="refresh()">
        <button class="btn btn-sm btn-link" @click="expandAll()">Expand all</button>
        <button class="btn btn-sm btn-link" @click="collapseAll()">Collapse all</button>
        <button class="btn btn-sm btn-link" @click="warningsOpen = !warningsOpen" x-text="warningsOpen ? 'Hide warnings' : 'Warnings'"></button>
        <span class="flex-grow-1"></span>
        <span class="mock-note" x-show="mode === 'edit'">
          <span class="badge b-new">new</span> <span class="badge b-bump">version +1</span> <span class="badge b-dep">deprecated</span>
        </span>
        <button class="btn btn-sm btn-outline-primary" @click="openAdd()" :disabled="!editable"
                :title="editable ? 'Add a node' : editHint">+ New node</button>
      </div>
      <template x-if="pick">
        <div class="pick-banner">
          <span>Click the new parent for <strong x-text="pick.label"></strong></span>
          <span class="flex-grow-1"></span>
          <button class="btn btn-sm btn-outline-primary" @click="pickTarget(null)">Make top level</button>
          <button class="btn btn-sm btn-outline-secondary" @click="pick = null; refresh()">Cancel</button>
        </div>
      </template>
      <div class="scroll py-1" :class="{ picking: pick }">
        <template x-if="!v.rows.length">
          <p class="text-muted p-3 mb-0" x-text="filter ? 'No matches.' : 'This tree is empty.'"></p>
        </template>
        <template x-for="r in v.rows" :key="r.key">
          <div class="trow" :id="'n-' + r.key" :class="r.cls" :style="'padding-left:' + (r.depth * 18 + 4) + 'px'"
               @click="rowClick(r)" @dblclick="openDetails(r.id)">
            <button class="caret" :class="{ invisible: !r.hasKids }" @click.stop="toggle(r.id)" x-text="r.open ? '▾' : '▸'"></button>
            <button class="kebab" title="Node actions" @click.stop="openMenu(r, $event)">⋮</button>
            <span class="lbl" x-text="r.label"></span>
            <span class="nk" x-show="r.nk" x-text="'(' + r.nk + ')'"></span>
            <template x-if="r.pill">
              <a class="pill" :class="'pill-' + r.pill.kind" :href="wormsUrl(r.aphia)" target="_blank" rel="noopener"
                 @click.stop :title="r.pill.title">🪱<template x-if="r.pill.badge"><span class="pb" x-text="r.pill.badge"></span></template></a>
            </template>
            <template x-if="r.mark === 'new'"><span class="badge b-new">new</span></template>
            <template x-if="r.mark === 'bump'"><span class="badge b-bump" x-text="'v' + r.version + ' → v' + (r.version + 1)"></span></template>
            <template x-if="r.mark === 'dep'"><span class="badge b-dep">deprecated</span></template>
          </div>
        </template>
      </div>
    </section>

    <!-- ===================== Changes panel ===================== -->
    <aside class="panel">
      <div class="panel-head">
        <h2>Changes</h2>
        <span class="flex-grow-1"></span>
        <small class="text-muted" x-text="v.head"></small>
      </div>
      <template x-if="job">
        <div class="job">
          <div x-text="job?.text + ': ' + job?.done + ' of ' + job?.total + ' AphiaIDs'"></div>
          <div class="progress"><div class="progress-bar" :style="'width:' + (100 * job?.done / job?.total) + '%'"></div></div>
          <template x-if="job?.retry">
            <div><span x-text="'Retrying AphiaID ' + job?.retry?.aphia + ' (attempt ' + job?.retry?.attempt + ' of 4)'"></span>
              <div class="progress"><div class="progress-bar bg-warning" :style="'width:' + job?.retry?.pct + '%'"></div></div></div>
          </template>
        </div>
      </template>
      <template x-if="mode === 'edit'">
        <nav class="tabs">
          <template x-for="t in tabs" :key="t.key">
            <button :class="{ active: tab === t.key }" @click="tab = t.key; unread[t.key] = false">
              <span x-text="t.label"></span>
              <template x-if="t.key === 'errors' && validated"><span class="badge text-bg-light" x-text="v.summary.errors + v.summary.conflicts.length"></span></template>
              <template x-if="t.key === 'worms' && validated"><span class="badge text-bg-light" x-text="v.summary.warnings"></span></template>
              <template x-if="unread[t.key]"><span class="dot"></span></template>
            </button>
          </template>
        </nav>
      </template>
      <template x-if="mode === 'edit' && tab !== 'edited' && !validated"><p class="text-muted p-3 mb-0">Press Validate to see the results.</p></template>
      <template x-if="mode === 'edit' && tab !== 'edited' && validated && stale"><div class="stale-note">Out of date: press Validate.</div></template>
      <template x-if="mode === 'edit' && tab !== 'edited' && validated">
        <div class="scroll" :class="{ stale }">
          <template x-for="row in tabRows" :key="row.key">
            <div class="crow" @mouseenter="hover = row.touched" @mouseleave="hover = []" @click="reveal(row.touched[0])">
              <div class="txt"><div x-text="row.text"></div>
                <template x-for="e in row.errors"><div class="chk err" x-text="'✖ ' + e"></div></template>
                <template x-for="w in row.warnings"><div class="chk warn" x-text="'⚠ ' + w"></div></template></div>
            </div>
          </template>
          <p class="text-muted p-3 mb-0" x-show="!tabRows.length">Nothing here.</p>
        </div>
      </template>
      <div class="summary" x-show="(mode === 'static' || tab === 'edited') && (v.summary.n || v.summary.conflicts.length)">
        <div>
          <span x-text="v.summary.n + ' changes'"></span>
          · <span :class="v.summary.errors ? 'text-danger fw-semibold' : ''" x-text="v.summary.errors + ' errors'"></span>
          · <span :class="v.summary.warnings ? 'text-warning-emphasis fw-semibold' : ''" x-text="v.summary.warnings + ' WoRMS warnings'"></span>
        </div>
        <div class="text-muted" x-text="v.summary.added + ' new nodes · ' + v.summary.bumped + ' version increases · ' + v.summary.deprecated + ' deprecated'"></div>
        <template x-if="v.summary.conflicts.length">
          <div class="alert alert-danger py-1 px-2 mt-2 mb-0">
            <strong>Conflict:</strong>
            <span x-text="v.summary.conflicts.join('; ')"></span>
            <template x-if="!frozen">
              <div class="mt-1">
                <button class="btn btn-sm btn-outline-danger" @click="rebase()" x-text="'Rebase on revision ' + latest"></button>
                <small class="text-muted">then adjust the changes</small>
              </div>
            </template>
          </div>
        </template>
      </div>
      <div class="scroll" x-show="mode === 'static' || tab === 'edited'">
        <template x-if="!v.items.length">
          <p class="text-muted p-3 mb-0" x-text="mode === 'edit' ? 'No changes yet. Use a node\'s ⋮ menu, or + New node.' : 'No changes to show.'"></p>
        </template>
        <template x-for="it in v.items" :key="it.key">
          <div>
            <template x-if="it.kind === 'group'">
              <div>
                <div class="group-head" @click="toggleGroup(it.group)">
                  <span x-text="collapsed[it.group] ? '▸' : '▾'"></span>
                  <span x-text="it.group"></span>
                  <small class="text-muted fw-normal" x-text="it.rows.length + ' changes'"></small>
                  <template x-if="it.errors"><span class="badge text-bg-danger" x-text="it.errors + ' errors'"></span></template>
                  <template x-if="it.warnings"><span class="badge b-warn" x-text="'⚠ ' + it.warnings"></span></template>
                  <span class="flex-grow-1"></span>
                  <template x-if="!frozen">
                    <button class="btn btn-sm btn-link text-danger p-0" title="Remove the whole group"
                            @click.stop="removeGroup(it.group)">✕</button>
                  </template>
                </div>
                <div class="group-body" x-show="!collapsed[it.group]">
                  <template x-for="row in (collapsed[it.group] ? [] : it.rows)" :key="'g' + row.i">
                    <div class="crow" @mouseenter="hover = row.touched" @mouseleave="hover = []" @click="reveal(row.touched[0])">
                      <span class="seq" x-text="row.i + 1"></span>
                      <span class="badge op" :class="'op-' + row.op" x-text="row.op"></span>
                      <div class="txt">
                        <div x-text="row.text"></div>
                        <template x-for="e in (showChecks ? row.errors : [])"><div class="chk err" x-text="'✖ ' + e"></div></template>
                        <template x-for="w in (showChecks ? row.warnings : [])"><div class="chk warn" x-text="'⚠ ' + w"></div></template>
                      </div>
                      <template x-if="!frozen">
                        <button class="x" title="Remove this change" @click.stop="removeChange(row.i)">✕</button>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </template>
            <template x-if="it.kind === 'one'">
              <div class="crow" @mouseenter="hover = it.row.touched" @mouseleave="hover = []" @click="reveal(it.row.touched[0])">
                <span class="seq" x-text="it.row.i + 1"></span>
                <span class="badge op" :class="'op-' + it.row.op" x-text="it.row.op"></span>
                <div class="txt">
                  <div x-text="it.row.text"></div>
                  <template x-for="e in (showChecks ? it.row.errors : [])"><div class="chk err" x-text="'✖ ' + e"></div></template>
                  <template x-for="w in (showChecks ? it.row.warnings : [])"><div class="chk warn" x-text="'⚠ ' + w"></div></template>
                </div>
                <template x-if="!frozen">
                  <button class="x" title="Remove this change" @click.stop="removeChange(it.row.i)">✕</button>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
      <div class="notes" x-show="mode === 'edit' || v.notes">
        <label class="form-label small text-muted mb-1">Notes</label>
        <template x-if="mode === 'edit' && !frozen">
          <textarea class="form-control form-control-sm" rows="2" x-model="cs.notes" @input="dirty = true"
                    placeholder="What this changeset does and why"></textarea>
        </template>
        <template x-if="frozen">
          <div class="small" x-text="v.notes || '—'"></div>
        </template>
      </div>
    </aside>
  </div>
</div>

<!-- ===================== Node menu ===================== -->
<template x-if="menu">
  <div class="dropdown-menu show node-menu shadow" :style="'left:' + menu.x + 'px; top:' + menu.y + 'px'"
       @click.outside="menu = null">
    <h6 class="dropdown-header" x-text="menu.label"></h6>
    <template x-for="m in menu.items" :key="m.key">
      <div>
        <template x-if="m.divider"><hr class="dropdown-divider"></template>
        <template x-if="!m.divider">
          <button class="dropdown-item d-flex justify-content-between gap-3" :class="{ disabled: m.hint }"
                  :title="m.hint || ''" @click="if (!m.hint) { const fn = m.fn; menu = null; fn(); }">
            <span x-text="m.text"></span>
            <span class="hint" x-text="m.hint"></span>
          </button>
        </template>
      </div>
    </template>
  </div>
</template>

<!-- ===================== Modals ===================== -->

<!-- Add / edit node -->
<template x-if="modal === 'node'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" x-text="f.mode === 'edit' ? 'Edit ' + f.orig.label : (f.parentFixed ? 'New child of ' + lbl(f.parent) : 'New node')"></h5>
          <button class="btn-close" @click="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Label</label>
            <input class="form-control" x-model="f.label" :class="{ 'is-invalid': f.label && labelError(f.label, f.id) }" autofocus>
            <div class="invalid-feedback" x-text="labelError(f.label, f.id)"></div>
            <div class="form-text">Machine-safe, unique in the tree: letters, digits, <code>_ . -</code></div>
          </div>
          <template x-if="f.mode === 'add' && !f.parentFixed">
            <div class="mb-2">
              <label class="form-label">Parent</label>
              <select class="form-select" x-model="f.parentKey">
                <option value="">(top level)</option>
                <template x-for="o in v.options" :key="o.key">
                  <option :value="o.key" x-text="o.text"></option>
                </template>
              </select>
            </div>
          </template>
          <template x-if="f.mode === 'add'">
            <div class="mb-2">
              <label class="form-label">Initial description</label>
              <textarea class="form-control" rows="2" x-model="f.description"></textarea>
            </div>
          </template>
          <div class="mb-2">
            <label class="form-label">AphiaID</label>
            <div class="input-group">
              <input class="form-control" x-model="f.aphia" :class="{ 'is-invalid': aphiaError(f.aphia) }" placeholder="none">
              <template x-if="/^\d+$/.test(f.aphia)">
                <a class="btn btn-outline-secondary" :href="wormsUrl(f.aphia)" target="_blank" rel="noopener">WoRMS ↗</a>
              </template>
            </div>
            <div class="form-text" x-show="f.mode === 'edit'">Clear it to remove the AphiaID.</div>
          </div>
          <template x-if="f.mode === 'add'">
            <div class="mb-2">
              <label class="form-label">Initial aliases</label>
              <input class="form-control" x-model="f.aliases" placeholder="comma-separated">
              <div class="form-text">Written as the node's aliases when the draft is published.</div>
            </div>
          </template>
          <template x-if="f.mode === 'edit'">
            <p class="form-text mb-0">Descriptions and aliases aren't part of drafts. Use <em>Edit description…</em>
              and <em>Edit aliases…</em> in the node menu.</p>
          </template>
        </div>
        <div class="modal-footer">
          <span class="me-auto small text-muted" x-text="f.mode === 'edit' ? 'Adds one edit change' : 'Adds one add change'"></span>
          <button class="btn btn-outline-secondary" @click="closeModal()">Cancel</button>
          <button class="btn btn-primary" :disabled="!!nodeFormError" :title="nodeFormError" @click="submitNode()"
                  x-text="f.mode === 'edit' ? 'Add edit to draft' : 'Add to draft'"></button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Aliases -->
<template x-if="modal === 'aliases'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" x-text="'Aliases of ' + lbl(f.id)"></h5>
          <button class="btn-close" @click="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-info py-2 small">
            Aliases aren't versioned and aren't part of any draft. Saving them takes effect at once,
            for every revision.
          </div>
          <ul class="list-group mb-2">
            <template x-for="(a, i) in f.list" :key="i + a">
              <li class="list-group-item d-flex align-items-center py-1">
                <span class="flex-grow-1" x-text="a"></span>
                <button class="btn btn-sm btn-link text-danger" @click="f.list.splice(i, 1)">remove</button>
              </li>
            </template>
            <template x-if="!f.list.length"><li class="list-group-item text-muted py-1">No aliases</li></template>
          </ul>
          <div class="input-group">
            <input class="form-control" x-model="f.add" placeholder="New alias (free text)"
                   @keydown.enter="if (f.add.trim()) { f.list.push(f.add.trim()); f.add = '' }">
            <button class="btn btn-outline-secondary" :disabled="!f.add.trim()" @click="f.list.push(f.add.trim()); f.add = ''">Add</button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" @click="closeModal()">Cancel</button>
          <button class="btn btn-primary" @click="saveAliases()">Save aliases</button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Description -->
<template x-if="modal === 'description'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" x-text="'Description of ' + lbl(f.id)"></h5>
          <button class="btn-close" @click="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-info py-2 small">
            Descriptions aren't versioned and aren't part of any draft. Saving takes effect at once,
            for every revision. Earlier descriptions are kept in the node's history; save an empty
            description to clear it.
          </div>
          <textarea class="form-control" rows="4" x-model="f.text"
                    placeholder="Definition and annotation guidance"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" @click="closeModal()">Cancel</button>
          <button class="btn btn-primary" @click="saveDescription()">Save description</button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Details -->
<template x-if="modal === 'details'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" x-text="f.label"></h5>
          <button class="btn-close" @click="closeModal()"></button>
        </div>
        <div class="modal-body">
          <dl class="row mb-0">
            <template x-for="row in f.rows" :key="row[0]">
              <div style="display: contents">
                <dt class="col-sm-3 text-muted fw-normal" x-text="row[0]"></dt>
                <dd class="col-sm-9" x-text="row[1]"></dd>
              </div>
            </template>
            <dt class="col-sm-3 text-muted fw-normal">WoRMS</dt>
            <dd class="col-sm-9">
              <template x-if="f.aphia"><a :href="wormsUrl(f.aphia)" target="_blank" rel="noopener" x-text="'AphiaID ' + f.aphia + ' ↗'"></a></template>
              <template x-if="!f.aphia"><span class="text-muted">not anchored</span></template>
            </dd>
            <dt class="col-sm-3 text-muted fw-normal">WoRMS warnings</dt>
            <dd class="col-sm-9">
              <template x-if="!f.warns.length"><span class="text-muted">none</span></template>
              <template x-for="w in f.warns"><div><code x-text="w.warning"></code> <span x-text="w.detail"></span></div></template>
            </dd>
          </dl>
          <p class="mock-note mb-0 mt-2">The full node page (version history, successors) is out of scope for this mockup.</p>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Deprecate -->
<template x-if="modal === 'deprecate'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" x-text="'Deprecate ' + lbl(f.id)"></h5>
          <button class="btn-close" @click="closeModal()"></button>
        </div>
        <div class="modal-body">
          <template x-if="f.kids">
            <div class="alert alert-warning mb-0">
              <strong x-text="lbl(f.id)"></strong> still has <span x-text="f.kids"></span> children.
              Move them elsewhere first, or use <em>Merge…</em> or <em>Split…</em>, which handle the children for you.
            </div>
          </template>
          <template x-if="!f.kids">
            <div>
              <p>The node leaves the tree from the next revision on. Its id still resolves, and its label becomes free.</p>
              <label class="form-label">Successors <span class="text-muted">(optional)</span></label>
              <div class="mb-1 d-flex flex-wrap gap-1">
                <template x-for="s in f.sel" :key="s">
                  <span class="badge text-bg-primary" x-text="lbl(s) + ' ✕'" style="cursor: pointer" @click="toggleSel(s)"></span>
                </template>
              </div>
              <input class="form-control form-control-sm mb-1" x-model="f.q" placeholder="Find nodes…">
              <div class="picker">
                <template x-for="o in pickerOptions(f.q, [f.id])" :key="o.key">
                  <label><input type="checkbox" :checked="f.sel.includes(o.id)" @change="toggleSel(o.id)">
                    <span x-text="o.label"></span><span class="path" x-text="o.path"></span></label>
                </template>
              </div>
              <div class="form-text">Successors tell consumers where ROIs labelled with this node probably belong now.</div>
            </div>
          </template>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" @click="closeModal()">Cancel</button>
          <button class="btn btn-danger" :disabled="f.kids > 0" @click="submitDeprecate()">Add to draft</button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Merge / split wizards -->
<template x-if="modal === 'merge' || modal === 'split'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <span x-text="(modal === 'merge' ? 'Merge ' : 'Split ') + lbl(f.a)"></span>
            <small class="text-muted" x-text="' · step ' + f.step + ' of 4: ' + wizSteps[f.step - 1]"></small>
          </h5>
          <button class="btn-close" @click="closeModal()"></button>
        </div>
        <div class="modal-body">

          <!-- merge step 1: pick nodes -->
          <template x-if="modal === 'merge' && f.step === 1">
            <div>
              <p>Choose the nodes to merge with <strong x-text="lbl(f.a)"></strong>. Siblings are listed first.</p>
              <div class="mb-1 d-flex flex-wrap gap-1">
                <span class="badge text-bg-secondary" x-text="lbl(f.a)"></span>
                <template x-for="s in f.sel" :key="s">
                  <span class="badge text-bg-primary" x-text="lbl(s) + ' ✕'" style="cursor: pointer" @click="toggleSel(s)"></span>
                </template>
              </div>
              <input class="form-control form-control-sm mb-1" x-model="f.q" placeholder="Find nodes…">
              <div class="picker">
                <template x-for="o in mergeCandidates()" :key="o.key">
                  <label><input type="checkbox" :checked="f.sel.includes(o.id)" @change="toggleSel(o.id)">
                    <span x-text="o.label"></span><span class="path" x-text="o.path"></span></label>
                </template>
              </div>
            </div>
          </template>

          <!-- step: mode (merge 2, split 1) -->
          <template x-if="(modal === 'merge' && f.step === 2) || (modal === 'split' && f.step === 1)">
            <div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" id="m-repl" :checked="f.repl" @change="setRepl(true)">
                <label class="form-check-label" for="m-repl">
                  <strong>With replacement</strong> (default)
                  <div class="small text-muted" x-show="modal === 'merge'">All merged nodes are deprecated, and a new node replaces them.</div>
                  <div class="small text-muted" x-show="modal === 'split'"><span x-text="lbl(f.a)"></span> is deprecated, and new nodes replace it.</div>
                </label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" id="m-norepl" :checked="!f.repl" @change="setRepl(false)">
                <label class="form-check-label" for="m-norepl">
                  <strong>Without replacement</strong>
                  <div class="small text-muted" x-show="modal === 'merge'">One node keeps its id and broadens; the others merge into it.</div>
                  <div class="small text-muted" x-show="modal === 'split'"><span x-text="lbl(f.a)"></span> keeps its id and narrows; new siblings take some of its children.</div>
                </label>
              </div>
              <template x-if="!f.repl && modal === 'merge'">
                <div class="ms-4 mb-2">
                  <label class="form-label">Surviving node</label>
                  <select class="form-select form-select-sm w-auto" x-model="f.survivorKey">
                    <template x-for="id in [f.a, ...f.sel]" :key="String(id)">
                      <option :value="String(id)" x-text="lbl(id)"></option>
                    </template>
                  </select>
                </div>
              </template>
              <div class="alert py-2 small" :class="f.repl ? 'alert-secondary' : 'alert-warning'"
                   x-text="f.repl ? 'Use this whenever existing ROIs labelled with the old node(s) might belong to a different new node.'
                     : (modal === 'merge' ? 'The survivor\'s meaning changes under the same id. If the merged-in nodes have no children, nothing records that. Use only when that is acceptable, e.g. for a misspelt duplicate.'
                        : 'Use only when old ROIs labelled ' + lbl(f.a) + ' are still correct as ' + lbl(f.a) + '.')"></div>
            </div>
          </template>

          <!-- merge step 3: new node -->
          <template x-if="modal === 'merge' && f.step === 3">
            <div>
              <template x-if="!f.repl">
                <p class="text-muted">No new node: the merged nodes' children move to <strong x-text="lbl(survivor())"></strong>.</p>
              </template>
              <template x-if="f.repl">
                <div>
                  <div class="row g-2">
                    <div class="col-md-6">
                      <label class="form-label">New node label</label>
                      <input class="form-control" x-model="f.parts[0].label" :class="{ 'is-invalid': f.parts[0].label && partErrors()[0] }">
                      <div class="invalid-feedback" x-text="partErrors()[0]"></div>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">AphiaID</label>
                      <input class="form-control" x-model="f.parts[0].aphia" placeholder="none">
                    </div>
                    <div class="col-12">
                      <label class="form-label">Description</label>
                      <input class="form-control" x-model="f.parts[0].description">
                    </div>
                    <div class="col-12">
                      <label class="form-label">Parent</label>
                      <select class="form-select" x-model="f.parentKey">
                        <option value="">(top level)</option>
                        <template x-for="o in mergeParentOptions()" :key="o.key">
                          <option :value="o.key" x-text="o.text"></option>
                        </template>
                      </select>
                      <div class="form-text">Defaults to the merged nodes' nearest common parent.</div>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- split step 2: new nodes -->
          <template x-if="modal === 'split' && f.step === 2">
            <div>
              <p x-text="f.repl ? 'Name the nodes that replace ' + lbl(f.a) + ' (at least two). They are added as its siblings.'
                                  : 'Name the new sibling(s) of ' + lbl(f.a) + '.'"></p>
              <template x-for="(p, i) in f.parts" :key="i">
                <div class="row g-2 mb-2 align-items-start">
                  <div class="col-md-5">
                    <input class="form-control form-control-sm" x-model="p.label" placeholder="label"
                           :class="{ 'is-invalid': p.label && partErrors()[i] }">
                    <div class="invalid-feedback" x-text="partErrors()[i]"></div>
                  </div>
                  <div class="col-md-2"><input class="form-control form-control-sm" x-model="p.aphia" placeholder="AphiaID"></div>
                  <div class="col-md-4"><input class="form-control form-control-sm" x-model="p.description" placeholder="description"></div>
                  <div class="col-md-1">
                    <button class="btn btn-sm btn-link text-danger" x-show="f.parts.length > (f.repl ? 2 : 1)" @click="f.parts.splice(i, 1)">✕</button>
                  </div>
                </div>
              </template>
              <button class="btn btn-sm btn-outline-secondary" @click="f.parts.push({ label: '', aphia: '', description: '' })">+ Another node</button>
              <p class="form-text" x-show="f.repl">The new nodes can't reuse <code x-text="lbl(f.a)"></code>: it stays taken until the deprecation is published.</p>
            </div>
          </template>

          <!-- split step 3: assign children -->
          <template x-if="modal === 'split' && f.step === 3">
            <div>
              <template x-if="!f.kids.length"><p class="text-muted"><span x-text="lbl(f.a)"></span> has no children to assign.</p></template>
              <template x-if="f.kids.length">
                <div>
                  <p x-text="f.repl ? 'Assign every child of ' + lbl(f.a) + ' to one of the new nodes.' : 'Choose which children move to a new node. The rest stay with ' + lbl(f.a) + '.'"></p>
                  <table class="table table-sm align-middle">
                    <template x-for="k in f.kids" :key="String(k)">
                      <tr>
                        <td x-text="lbl(k)"></td>
                        <td>
                          <select class="form-select form-select-sm" x-model="f.assign[String(k)]"
                                  :class="{ 'is-invalid': f.repl && f.assign[String(k)] === '' }">
                            <option value="" x-text="f.repl ? '— choose —' : 'stay with ' + lbl(f.a)"></option>
                            <template x-for="(p, i) in f.parts" :key="i">
                              <option :value="String(i)" x-text="p.label || '(new node ' + (i + 1) + ')'"></option>
                            </template>
                          </select>
                        </td>
                      </tr>
                    </template>
                  </table>
                </div>
              </template>
            </div>
          </template>

          <!-- step 4: review -->
          <template x-if="f.step === 4">
            <div>
              <p>These changes will be added to the draft as <code x-text="f.preview.group"></code>. You can remove them later as a group.</p>
              <div class="review">
                <template x-for="row in f.preview.rows" :key="row.i">
                  <div class="crow">
                    <span class="seq" x-text="row.i + 1"></span>
                    <span class="badge op" :class="'op-' + row.op" x-text="row.op"></span>
                    <div class="txt">
                      <div x-text="row.text"></div>
                      <template x-for="e in row.errors"><div class="chk err" x-text="'✖ ' + e"></div></template>
                      <template x-for="w in row.warnings"><div class="chk warn" x-text="'⚠ ' + w"></div></template>
                    </div>
                  </div>
                </template>
              </div>
              <p class="form-text" x-show="modal === 'merge'">
                After publishing, the deprecated nodes' labels and aliases are copied into the aliases of
                <span x-text="f.repl ? 'the new node' : lbl(survivor())"></span>.
              </p>
            </div>
          </template>
        </div>
        <div class="modal-footer">
          <span class="me-auto small text-danger" x-text="wizError"></span>
          <button class="btn btn-outline-secondary" @click="f.step > 1 ? f.step-- : closeModal()" x-text="f.step > 1 ? 'Back' : 'Cancel'"></button>
          <template x-if="f.step < 4">
            <button class="btn btn-primary" :disabled="!!wizError" @click="wizNext()">Next</button>
          </template>
          <template x-if="f.step === 4">
            <button class="btn btn-primary" @click="addChanges(f.preview.changes); closeModal()">Add to draft</button>
          </template>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Publish -->
<template x-if="modal === 'publish'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" x-text="'Publish draft #' + cs.id + ' as revision ' + (latest + 1)"></h5>
          <button class="btn-close" @click="closeModal()"></button>
        </div>
        <div class="modal-body">
          <p class="small" x-text="v.summary.n + ' changes · ' + v.summary.added + ' new nodes · ' + v.summary.bumped + ' version increases · ' + v.summary.deprecated + ' deprecated · ' + v.summary.warnings + ' WoRMS warnings'"></p>
          <label class="form-label">Notes</label>
          <textarea class="form-control" rows="3" x-model="f.notes"></textarea>
          <p class="form-text mb-0">All checks run again against the latest revision. A published revision can't be edited.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" @click="closeModal()">Cancel</button>
          <button class="btn btn-success" @click="doPublish()">Publish</button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- New tree: empty, from an import file, or from the shown revision (clone) -->
<template x-if="modal === 'clone'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" x-text="f.kind === 'clone' ? 'New tree from ' + treeId + ' @ revision ' + viewRev : (f.kind === 'import' ? 'New tree from an import file' : 'New empty tree')"></h5>
          <button class="btn-close" @click="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <template x-for="k in ['empty', 'import', 'clone']" :key="k">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" :id="'nt-' + k" :value="k" x-model="f.kind" :disabled="k === 'clone' && latest === 0">
                <label class="form-check-label" :for="'nt-' + k" x-text="{ empty: 'Empty', import: 'From an import file', clone: 'From this revision' }[k]"></label>
              </div>
            </template>
          </div>
          <div class="mb-2">
            <label class="form-label">New tree id</label>
            <input class="form-control" x-model="f.id" :class="{ 'is-invalid': f.id && cloneError }">
            <div class="invalid-feedback" x-text="cloneError"></div>
          </div>
          <div class="mb-2">
            <label class="form-label">Title</label>
            <input class="form-control" x-model="f.title">
          </div>
          <template x-if="f.kind === 'import'">
            <div class="mb-2">
              <input class="form-control form-control-sm mb-2" type="file" accept=".json" disabled title="Loads the file into the box below">
              <textarea class="form-control font-monospace" rows="6" x-model="f.text" placeholder="…or paste the file here"></textarea>
            </div>
          </template>
          <div class="text-danger small" x-text="f.error"></div>
          <p class="form-text mb-0">
            Creates a new-tree draft (no base revision) and opens it in the editor. From an import file or this
            revision, the nodes form one <code>import#1</code> group; a clone copies this revision's nodes and AphiaIDs
            with their current descriptions and aliases, under new ids. An owner publishes it as revision 1.
            The organization page offers the same for its owners. See webapp.md, "New trees".
          </p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" @click="closeModal()">Cancel</button>
          <button class="btn btn-primary" :disabled="!!cloneError" @click="doClone()">Create draft</button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Organization page (members and roles) -->
<template x-if="modal === 'org'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">AMPLIfy · members</h5><button class="btn-close" @click="closeModal()"></button></div>
      <div class="modal-body">
        <p class="small text-muted">Trees: NES2022_taxonomy, NES2022_tags. Each role includes the ones below it
          (reader &lt; drafter &lt; approver &lt; owner) and applies to every tree of the organization.</p>
        <div class="alert alert-danger py-1 small" x-show="f.error" x-text="f.error"></div>
        <table class="table table-sm align-middle">
          <template x-for="m in members" :key="m.user">
            <tr><td x-text="m.user"></td>
              <td><select class="form-select form-select-sm" :disabled="!has('owner')" @change="setMember(m.user, $event.target.value)">
                <template x-for="r in ['reader', 'drafter', 'approver', 'owner']" :key="r"><option :value="r" :selected="r === m.role" x-text="r"></option></template>
              </select></td></tr>
          </template>
        </table>
        <p class="form-text mb-0" x-text="has('owner') ? 'Owners add, change and remove members. The last owner can\'t step down.' : 'Only owners change members.'"></p>
      </div>
    </div></div>
  </div>
</template>

<!-- Setup wizard: what a site admin sees on an instance with no trees -->
<template x-if="modal === 'setup'">
  <div class="modal d-block" tabindex="-1" @click.self="closeModal()">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Set up this instance</h5><button class="btn-close" @click="closeModal()"></button></div>
      <div class="modal-body">
        <p class="small text-muted">On a new instance the home page sends the site admin here (<code>/setup/</code>) until the first tree exists.</p>
        <div class="mb-3">
          <template x-for="(s, i) in ['Organization', 'Users', 'Trees']" :key="s">
            <span class="badge me-1" :class="i + 1 === f.step ? 'text-bg-primary' : (i + 1 < f.step ? 'text-bg-success' : 'text-bg-light border')" x-text="s"></span>
          </template>
        </div>
        <template x-if="f.step === 1">
          <div>
            <p class="form-text">Trees belong to an organization, and users hold their roles there.</p>
            <div class="row g-2">
              <div class="col-4"><label class="form-label small">Id</label><input class="form-control form-control-sm" x-model="f.orgId" placeholder="lab_a"></div>
              <div class="col-8"><label class="form-label small">Name</label><input class="form-control form-control-sm" x-model="f.orgName" placeholder="Lab A"></div>
            </div>
          </div>
        </template>
        <template x-if="f.step === 2">
          <div>
            <p class="form-text">Users of <span x-text="f.org.name"></span>. Give it at least one owner, who manages its members afterwards.</p>
            <table class="table table-sm">
              <template x-for="u in f.users" :key="u.user"><tr><td x-text="u.user"></td><td x-text="u.role"></td><td class="small text-muted" x-text="u.created ? 'account created' : ''"></td></tr></template>
              <template x-if="!f.users.length"><tr><td class="text-muted">No members yet.</td></tr></template>
            </table>
            <div class="row g-2">
              <div class="col-6"><label class="form-label small">Username</label><input class="form-control form-control-sm" x-model="f.username" @input="f.needsPw = false" placeholder="curator1"></div>
              <div class="col-3"><label class="form-label small">Role</label>
                <select class="form-select form-select-sm" x-model="f.role">
                  <template x-for="r in ['reader', 'drafter', 'approver', 'owner']" :key="r"><option :value="r" :selected="r === f.role" x-text="r"></option></template>
                </select></div>
            </div>
            <template x-if="f.needsPw">
              <div class="row g-2 mt-1">
                <div class="col-12 small"><span x-text="f.username"></span> has no account yet: give an initial password to create it. They can change it on their account page.</div>
                <div class="col-6"><input class="form-control form-control-sm" type="password" x-model="f.pw" placeholder="Initial password"></div>
                <div class="col-6"><input class="form-control form-control-sm" type="password" x-model="f.pw2" placeholder="Again"></div>
              </div>
            </template>
            <button class="btn btn-sm btn-outline-primary mt-2" :disabled="!f.username.trim()" @click="setupAddUser()" x-text="f.needsPw ? 'Create account and add' : 'Add'"></button>
          </div>
        </template>
        <template x-if="f.step === 3">
          <div>
            <ul x-show="f.trees.length"><template x-for="t in f.trees" :key="t.id"><li><strong x-text="t.id"></strong> <span x-text="t.title + ' · revision 1 · ' + t.nodes + ' nodes'"></span></li></template></ul>
            <p class="form-text">Each import is checked, its WoRMS records are fetched (with the usual job progress), and it is published as the tree's revision 1.</p>
            <div class="row g-2">
              <div class="col-4"><label class="form-label small">Tree id</label><input class="form-control form-control-sm" x-model="f.treeId"></div>
              <div class="col-8"><label class="form-label small">Title</label><input class="form-control form-control-sm" x-model="f.treeTitle"></div>
            </div>
            <input class="form-control form-control-sm my-2" type="file" accept=".json" disabled title="Loads the file into the box below">
            <textarea class="form-control form-control-sm font-monospace" rows="6" x-model="f.text" placeholder="…or paste the file here"></textarea>
            <button class="btn btn-sm btn-outline-primary mt-2" :disabled="!f.treeId.trim() || !f.text.trim()" @click="setupImport()">Import</button>
          </div>
        </template>
        <div class="text-danger small mt-2" x-text="f.error"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" :disabled="f.step === 1 && !f.org" @click="setupSkip()">Skip</button>
        <template x-if="f.step === 1"><button class="btn btn-primary" :disabled="!f.orgId.trim() || !f.orgName.trim()" @click="setupOrg()">Create and continue</button></template>
        <template x-if="f.step === 2"><button class="btn btn-primary" @click="setupLeaveUsers()">Continue</button></template>
        <template x-if="f.step === 3 && f.trees.length"><button class="btn btn-primary" @click="setupDone()">Done</button></template>
      </div>
    </div></div>
  </div>
</template>

<!-- Confirm -->
<template x-if="conf">
  <div class="modal d-block" tabindex="-1" style="z-index: 1080">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" x-text="conf.title"></h5></div>
        <div class="modal-body" x-text="conf.body"></div>
        <div class="modal-footer">
          <button class="btn btn-outline-secondary" @click="conf = null">Cancel</button>
          <button class="btn" :class="conf.cls" @click="const fn = conf.fn; conf = null; fn()" x-text="conf.ok"></button>
        </div>
      </div>
    </div>
  </div>
</template>

<div class="toasts">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast show align-items-center border-0" :class="t.cls"><div class="toast-body" x-text="t.text"></div></div>
  </template>
</div>

<script>
// ---------------------------------------------------------------------------
// Engine: atomic changes over an in-memory tree (see design/backend.md)
// ---------------------------------------------------------------------------
const LABEL_RE = /^[A-Za-z0-9][A-Za-z0-9_.-]*$/;
// The role in the tree's organization; each includes the ones below it.
const ROLES = {
  anonymous: [],
  reader: ['reader'],
  drafter: ['reader', 'drafter'],
  approver: ['reader', 'drafter', 'approver'],
  owner: ['reader', 'drafter', 'approver', 'owner'],
};
const isPh = id => typeof id === 'string' && id.startsWith('new:');
const keyOf = id => (id == null ? '' : String(id));
const idOf = key => (key === '' || key == null ? null : (isPh(key) ? key : Number(key)));

// Mock database. Nothing here leaves the page.
const DB = { ver: 0, nextId: 1001, nextCs: 1, trees: {}, changesets: {}, aliases: {}, descriptions: {}, warnings: {} };
// Current description: set directly (unversioned), or the initial one carried by a draft's add.
const descOf = (id, n) => DB.descriptions[id] ?? n?.description ?? '';

// Apply an ordered list of changes to a state (Map id -> node) and check each
// change against the state left by the ones before it. Nodes deprecated by
// these changes stay in the returned state with dep = true.
function applyChanges(base, changes) {
  const s = new Map();
  for (const [k, n] of base) s.set(k, { ...n });
  const added = new Set(), deprecated = new Set(), bump = new Set(), touchedAll = new Set();
  const live = id => s.has(id) && !s.get(id).dep;
  const labelOwner = label => { for (const n of s.values()) if (!n.dep && n.label === label) return n; };
  const liveKids = id => [...s.values()].filter(n => !n.dep && n.parent === id);
  const ancOrSelf = (a, b) => { // is a an ancestor of b, or b itself?
    const seen = new Set();
    for (let cur = b; cur != null && !seen.has(cur); cur = s.get(cur)?.parent ?? null) {
      if (cur === a) return true;
      seen.add(cur);
    }
    return false;
  };
  const checkLabel = (label, self, e) => {
    if (!LABEL_RE.test(label || '')) return e.push(`label "${label}" is not machine-safe`);
    const o = labelOwner(label);
    if (o && o.id !== self) e.push(`label "${label}" is already used by ${o.id}`);
  };
  const nm = id => (s.has(id) ? `${s.get(id).label} (${id})` : String(id));
  const checkNode = (id, e) => { if (!live(id)) e.push(`${nm(id)} is not in the tree`); };
  const checkParent = (p, e) => { if (p != null && !live(p)) e.push(`parent ${nm(p)} is not in the tree`); };
  const dupAphia = (id, aphia, w) => {
    if (aphia == null) return;
    for (const n of s.values())
      if (!n.dep && n.id !== id && n.aphia_id === aphia) w.push(`duplicate_aphia: ${n.label} has AphiaID ${aphia} too`);
  };
  const currentWarnings = (id, w) => {
    for (const x of DB.warnings[id] || []) w.push(`${x.warning} (current): ${x.detail}`);
  };

  const results = changes.map(c => {
    const e = [], w = [], t = [c.node];
    const before = s.has(c.node) ? { ...s.get(c.node) } : null;
    switch (c.op) {
      case 'add':
        if (s.has(c.node)) { e.push(`node ${c.node} already exists`); break; }
        checkLabel(c.label, c.node, e);
        checkParent(c.parent, e);
        dupAphia(c.node, c.aphia_id ?? null, w);
        s.set(c.node, { id: c.node, label: c.label, parent: c.parent ?? null, aphia_id: c.aphia_id ?? null,
                        description: c.description || '', version: 1, created: null, dep: false });
        added.add(c.node);
        if (c.parent != null) { t.push(c.parent); bump.add(c.parent); }
        break;
      case 'edit':
        checkNode(c.node, e);
        if (!s.has(c.node)) break;
        if ('label' in c) checkLabel(c.label, c.node, e);
        if ('aphia_id' in c) dupAphia(c.node, c.aphia_id, w);
        else currentWarnings(c.node, w);
        Object.assign(s.get(c.node), Object.fromEntries(
          ['label', 'aphia_id'].filter(k => k in c).map(k => [k, c[k]])));
        bump.add(c.node);
        break;
      case 'move':
        checkNode(c.node, e);
        checkParent(c.to_parent, e);
        if (!s.has(c.node)) break;
        if (c.to_parent != null && ancOrSelf(c.node, c.to_parent)) { e.push('this move would create a cycle'); break; }
        if (s.get(c.node).parent !== (c.from_parent ?? null))
          e.push(`node is no longer under ${s.get(c.from_parent)?.label ?? 'top level'}`);
        t.push(s.get(c.node).parent, c.to_parent);
        bump.add(s.get(c.node).parent); bump.add(c.to_parent); bump.add(c.node);
        s.get(c.node).parent = c.to_parent ?? null;
        currentWarnings(c.node, w);
        break;
      case 'deprecate':
        checkNode(c.node, e);
        if (!s.has(c.node)) break;
        if (liveKids(c.node).length) e.push(`node still has ${liveKids(c.node).length} children`);
        for (const x of c.successors || []) if (!live(x)) e.push(`successor ${nm(x)} is not in the tree`);
        s.get(c.node).dep = true;
        deprecated.add(c.node);
        t.push(s.get(c.node).parent);
        bump.add(s.get(c.node).parent);
        break;
    }
    const touched = t.filter(x => x != null);
    touched.forEach(x => touchedAll.add(x));
    return { errors: e, warnings: w, touched, before };
  });
  // a node's version increases at most once, and only if it existed before and survives
  for (const id of [...bump]) if (id == null || !base.has(id) || deprecated.has(id) || added.has(id)) bump.delete(id);
  return { state: s, results, added, deprecated, bump, touchedAll };
}

// Replay a tree's published changesets. Cached until DB.ver changes.
const HCACHE = {};
function history(treeId) {
  const hit = HCACHE[treeId];
  if (hit && hit.ver === DB.ver) return hit;
  const tree = DB.trees[treeId];
  const snaps = [new Map()], evs = [null];
  tree.revs.forEach((csId, i) => {
    const r = i + 1;
    const ev = applyChanges(snaps[i], DB.changesets[csId].changes);
    const snap = new Map();
    for (const [id, n] of ev.state) {
      if (n.dep) continue;
      const m = { ...n };
      if (ev.added.has(id)) m.created = r;
      if (ev.bump.has(id)) m.version += 1;
      snap.set(id, m);
    }
    snaps.push(snap);
    evs.push(ev);
  });
  return (HCACHE[treeId] = { ver: DB.ver, snaps, evs });
}

function childIndex(state, includeDep) {
  const kids = new Map();
  for (const n of state.values()) {
    if (n.dep && !includeDep) continue;
    if (!kids.has(n.parent)) kids.set(n.parent, []);
    kids.get(n.parent).push(n.id);
  }
  for (const list of kids.values())
    list.sort((a, b) => state.get(a).label.localeCompare(state.get(b).label, undefined, { sensitivity: 'base' }));
  return kids;
}

function nodePath(state, id) {
  const parts = [];
  for (let n = state.get(state.get(id)?.parent); n; n = state.get(n.parent)) parts.unshift(n.label);
  return parts.join(' / ');
}

function describe(c, r, st) {
  const name = id => {
    if (id == null) return 'top level';
    const l = st.get(id)?.label ?? r.before?.label ?? '?';
    return isPh(id) ? `${id} (${l})` : l;
  };
  switch (c.op) {
    case 'add':
      return `${name(c.node)} under ${name(c.parent)}` + (c.aphia_id ? `, AphiaID ${c.aphia_id}` : '');
    case 'edit': {
      const b = r.before || {}, bits = [];
      if ('label' in c) bits.push(`label → ${c.label}`);
      if ('aphia_id' in c) bits.push(`AphiaID ${b.aphia_id ?? 'none'} → ${c.aphia_id ?? 'none'}`);
      return `${isPh(c.node) ? c.node + ' (' + b.label + ')' : (b.label ?? c.node)}: ${bits.join(', ')}`;
    }
    case 'move':
      return `${name(c.node)}: ${name(c.from_parent)} → ${name(c.to_parent)}`;
    case 'deprecate':
      return name(c.node) + (c.successors?.length ? ` → successors ${c.successors.map(name).join(', ')}` : '');
  }
}

// Publish: assign real ids to placeholders, write initial descriptions and aliases, copy aliases
// after merges, and append the revision.
function publish(cs, when) {
  const tree = DB.trees[cs.tree];
  const h = history(cs.tree);
  const base = h.snaps[tree.revs.length];
  const map = {};
  for (const c of cs.changes) if (c.op === 'add' && isPh(c.node)) map[c.node] = DB.nextId++;
  const re = v => (isPh(v) ? map[v] : v);
  cs.changes = cs.changes.map(c => {
    const d = { ...c };
    for (const k of ['node', 'parent', 'from_parent', 'to_parent']) if (k in d) d[k] = re(d[k]);
    if (d.successors) d.successors = d.successors.map(re);
    return d;
  });
  const ev = applyChanges(base, cs.changes);
  for (const c of cs.changes) {
    if (c.op === 'add' && c.aliases?.length) DB.aliases[c.node] = [...c.aliases];
    if (c.op === 'add' && c.description) DB.descriptions[c.node] = c.description;
    if (c.op === 'deprecate' && c.group?.startsWith('merge#') && c.successors?.length === 1) {
      const to = c.successors[0];
      DB.aliases[to] = [...new Set([...(DB.aliases[to] || []), ev.state.get(c.node).label, ...(DB.aliases[c.node] || [])])];
    }
  }
  cs.state = 'published';
  cs.rev = tree.revs.length + 1;
  cs.published_at = when;
  tree.revs.push(cs.id);
  DB.ver++;
}

function importChanges(nodes, group) {
  let k = 0;
  const out = [];
  const walk = (list, parent) => {
    for (const n of list) {
      const id = `new:${++k}`;
      out.push({ op: 'add', node: id, label: n.label, parent, aphia_id: n.aphia_id ?? null,
                 description: n.description || '', aliases: n.aliases || [], group });
      walk(n.children || [], id);
    }
  };
  walk(nodes, null);
  return out;
}
