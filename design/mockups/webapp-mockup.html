    return this.tree.revs.map((id, i) => {
      const cs = DB.changesets[id];
      return { rev: i + 1, text: `${i + 1} · ${cs.published_at} · ${cs.author}` + (i + 1 === this.latest ? ' (latest)' : '') };
    }).reverse();
  },
  get openDrafts() { this.ver; return Object.values(DB.changesets).filter(c => c.tree === this.treeId && c.state === 'draft'); },
  get discardedDrafts() { this.ver; return Object.values(DB.changesets).filter(c => c.tree === this.treeId && c.state === 'discarded'); },
  get frozen() { return this.mode === 'static' || this.cs?.state === 'discarded'; },
  get editable() { return !this.frozen && this.has('drafter'); },
  get editHint() {
    if (this.mode === 'static') return 'Edit mode only';
    if (this.frozen) return 'Discarded drafts are read-only';
    return 'Needs drafter role';
  },
  get status() {
    if (this.mode === 'static')
      return this.latest ? { text: 'Published (frozen)', cls: 'text-bg-success' } : { text: 'None', cls: 'text-bg-secondary' };
    if (this.cs.state === 'discarded') return { text: 'Discarded (frozen)', cls: 'text-bg-dark' };
    if (this.dirty) return { text: 'Draft (unsaved)', cls: 'text-bg-warning' };
    if (this.cs.id) return { text: 'Draft (saved)', cls: 'text-bg-info' };
    return { text: 'None', cls: 'text-bg-secondary' };
  },
  get saveBlock() {
    if (!this.has('drafter')) return 'Needs drafter role';
    if (!this.dirty) return 'No unsaved changes';
    if (!this.validated || this.stale) return 'Validate first';
    return '';
  },
  get publishBlock() {
    if (!this.has('approver')) return 'Needs approver role';
    if (!this.cs.id || this.dirty) return 'Save the draft first';
    if (!this.cs.changes.length) return 'No changes';
    if (!this.validated || this.stale) return 'Validate first';
    if (this.v.summary.errors) return `Fix ${this.v.summary.errors} errors first`;
    if (this.v.summary.conflicts.length) return 'Resolve the conflict first';
    return '';
  },

  // ---- view computation --------------------------------------------------
  refresh() {
    const h = history(this.treeId);
    let state, ev = null, changes = [], head = '', notes = '';
    if (this.mode === 'static') {
      state = h.snaps[this.viewRev] || new Map();
      if (this.viewRev > 0) {
        const cs = DB.changesets[this.tree.revs[this.viewRev - 1]];
        ev = h.evs[this.viewRev];
        changes = cs.changes;
        head = `revision ${this.viewRev} · changeset #${cs.id} · ${cs.author} · ${cs.published_at}`;
        notes = cs.notes;
      }
    } else {
      const base = this.cs.base_rev == null ? new Map() : h.snaps[this.cs.base_rev];
      ev = applyChanges(base, this.cs.changes);
      state = ev.state;
      changes = this.cs.changes;
      head = (this.cs.id ? `draft #${this.cs.id} · ${this.cs.author}` : 'new draft') + ` · base ${this.cs.base_rev ?? 'none'}`;
      notes = this.cs.notes;
    }
    const showMarks = this.mode === 'edit';
    const kids = childIndex(state, true);
    CUR = { state, ev, kids };

    // tree rows
    const q = this.filter.trim().toLowerCase();
    let match = null;
    if (q) {
      match = new Set();
      for (const n of state.values()) {
        const hit = n.label.toLowerCase().includes(q) || (DB.aliases[n.id] || []).some(a => a.toLowerCase().includes(q));
        if (hit) for (let m = n; m && !match.has(m.id); m = state.get(m.parent)) match.add(m.id);
      }
    }
    const exp = (this.exp[this.treeId] ||= {});
    const hov = new Set(this.hover);
    const pickBad = this.pick ? this.descendantsOf(this.pick.id) : null;
    const rows = [];
    const walk = (pid, depth) => {
      for (const id of kids.get(pid) || []) {
        if (match && !match.has(id)) continue;
        const n = state.get(id);
        const nk = (kids.get(id) || []).filter(k => !state.get(k).dep).length;
        const hasKids = (kids.get(id) || []).length > 0;
        const open = match ? true : !!exp[keyOf(id)];
        const mark = !showMarks ? '' : ev.added.has(id) ? 'new' : (n.dep && ev.deprecated.has(id)) ? 'dep' : ev.bump.has(id) ? 'bump' : '';
        const warns = DB.warnings[id] || [];
        const cls = [mark && 'mark-' + mark, hov.has(id) && 'hl',
                     q && n.label.toLowerCase().includes(q) && 'hit',
                     pickBad && (pickBad.has(id) || n.dep ? 'unpickable' : 'pickable')].filter(Boolean).join(' ');
        rows.push({ id, key: keyOf(id), depth, label: n.label, aphia: n.aphia_id, nk, hasKids, open, mark,
                    version: n.version, warns, pill: this.pill(n, warns, ev?.added?.has(id)), cls });
        if (open) walk(id, depth + 1);
      }
    };
    walk(null, 0);

    // change list
    const items = [];
    const summary = { n: changes.length, errors: 0, warnings: 0, added: 0, bumped: 0, deprecated: 0, conflicts: [] };
    if (ev) {
      let cur = null;
      changes.forEach((c, i) => {
        const r = ev.results[i];
        const row = { i, op: c.op, text: describe(c, r, ev.state), errors: r.errors, warnings: r.warnings, touched: r.touched };
        summary.errors += r.errors.length;
        summary.warnings += r.warnings.length;
        if (c.group) {
          if (!cur || cur.group !== c.group) {
            cur = { kind: 'group', group: c.group, key: 'g' + i, rows: [], errors: 0, warnings: 0 };
            items.push(cur);
            if (!(c.group in this.collapsed)) this.collapsed[c.group] = changes.filter(x => x.group === c.group).length > 12;
          }
          cur.rows.push(row);
          cur.errors += r.errors.length;
          cur.warnings += r.warnings.length;
        } else {
          cur = null;
          items.push({ kind: 'one', key: 'c' + i, row });
        }
      });
      summary.added = ev.added.size;
      summary.bumped = ev.bump.size;
      summary.deprecated = ev.deprecated.size;
    }
    if (this.mode === 'edit') summary.conflicts = this.conflicts(ev);

    // node options for selects (live nodes only)
    const options = [...state.values()].filter(n => !n.dep)
      .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base' }))
      .map(n => ({ id: n.id, key: keyOf(n.id), label: n.label, path: nodePath(state, n.id),
                   text: n.label + (n.parent != null ? `  (in ${state.get(n.parent)?.label})` : '') }));

    this.v = { rows, items, summary, options, head, notes };
  },

  conflicts(ev) {
    const b = this.cs.base_rev, L = this.latest, out = [];
    if (b == null) return L ? [`the tree already has revision ${L}; a first-revision draft can't be published`] : [];
    const h = history(this.treeId);
    for (let r = b + 1; r <= L; r++) {
      const theirs = h.evs[r].touchedAll;
      const both = [...ev.touchedAll].filter(id => !isPh(id) && theirs.has(id));
      if (both.length) out.push(`revision ${r} also changed ${both.map(id => this.lbl(id)).join(', ')}`);
    }
    return out;
  },

  lbl(id) {
    if (id == null) return 'top level';
    return CUR.state.get(id)?.label ?? String(id);
  },
  wormsUrl(id) { return `https://www.marinespecies.org/aphia.php?p=taxdetails&id=${id}`; },
  live(id) { const n = CUR.state.get(id); return !!n && !n.dep; },
  liveKids(id) { return (CUR.kids.get(id) || []).filter(k => !CUR.state.get(k).dep); },
  descendantsOf(id) {
    const out = new Set([id]);
    const walk = p => (CUR.kids.get(p) || []).forEach(k => { out.add(k); walk(k); });
    walk(id);
    return out;
  },

  // AphiaID pill: grey never fetched (here: added in the draft), red ? unknown_aphia,
  // orange ! any other warning, else green. No AphiaID, no pill.
  pill(n, warns, added) {
    if (n.aphia_id == null) return null;
    const codes = warns.map(w => w.warning);
    let kind = 'green', badge = '';
    if (codes.includes('unknown_aphia')) { kind = 'red'; badge = '?'; }
    else if (codes.length) { kind = 'orange'; badge = '!'; }
    else if (added) kind = 'grey';
    const title = [`AphiaID ${n.aphia_id}` + (kind === 'grey' ? ' (not fetched yet: Validate fetches it)' : ''),
                   ...warns.map(w => `${w.warning}: ${w.detail}`)].join('\n');
    return { kind, badge, title };
  },

  // ---- validate, tabs, syncs (simulated: nothing leaves the page) ----------
  get changesKey() { return JSON.stringify([this.cs?.base_rev, this.cs?.changes]); },
  get validated() { return this.validatedKey !== null; },
  get stale() { return this.validated && this.validatedKey !== this.changesKey; },
  get showChecks() { return this.mode === 'static' || (this.validated && !this.stale); },
  get validateBlock() {
    if (!this.cs?.changes.length) return 'No changes yet';
    if (this.job) return 'Validating…';
    if (this.validated && !this.stale) return 'Already validated';
    return '';
  },
  validate() {
    const cached = new Set([...history(this.treeId).snaps[this.latest].values()].map(n => n.aphia_id));
    const missing = [...new Set(this.cs.changes.map(c => c.aphia_id).filter(a => a != null && !cached.has(a)))];
    const finish = () => {
      this.job = null;
      this.validatedKey = this.changesKey;
      for (const t of this.tabs) if (t.key !== this.tab) this.unread[t.key] = true;
      this.refresh();
    };
    if (!missing.length) return finish();
    // A fetch job for the AphiaIDs that aren't cached, with one retry shown.
    this.job = { text: 'Fetching WoRMS records', done: 0, total: missing.length, retry: null };
    let step = 0;
    const tick = () => {
      step++;
      if (step <= 5) this.job.retry = { aphia: missing[0], attempt: 1 + Math.floor(step / 3), pct: step * 12 };
      else { this.job.retry = null; this.job.done = Math.min(this.job.total, this.job.done + 1); }
      if (this.job.done < this.job.total) setTimeout(tick, 250); else finish();
    };
    setTimeout(tick, 250);
  },
  get tabRows() {
    const rows = this.v.items.flatMap(it => (it.kind === 'group' ? it.rows : [it.row]));
    const ev = CUR.ev;
    switch (this.tab) {
      case 'reduced':
        return rows.map(r => ({ key: r.i, text: `${r.i + 1} ${r.op} ${r.text}`, touched: r.touched, errors: [], warnings: [] }));
      case 'bynode':
        return [...(ev?.added || []), ...(ev?.bump || []), ...(ev?.deprecated || [])].map(id => {
          const n = CUR.state.get(id);
          const v = ev.added.has(id) ? 'new → v1' : ev.deprecated.has(id) ? `v${n.version} → deprecated` : `v${n.version} → v${n.version + 1}`;
          return { key: keyOf(id), text: `${n.label}: ${v}`, touched: [id], errors: [], warnings: [] };
        });
      case 'summary':
        return [{ key: 's', touched: [], errors: [], warnings: [],
                  text: `${this.v.summary.n} changes · ${this.v.summary.added} new · ${this.v.summary.bumped} version increases · ${this.v.summary.deprecated} deprecated · ${this.v.summary.errors} errors · ${this.v.summary.warnings} WoRMS warnings` }];
      case 'worms':
        return rows.filter(r => r.warnings.length).map(r => ({ key: r.i, text: r.text, touched: r.touched, errors: [], warnings: r.warnings }));
      case 'errors':
        return [...this.v.summary.conflicts.map((c, i) => ({ key: 'c' + i, text: 'stale_base: ' + c, touched: [], errors: [], warnings: [] })),
                ...rows.filter(r => r.errors.length).map(r => ({ key: r.i, text: r.text, touched: r.touched, errors: r.errors, warnings: [] }))];
    }
    return [];
  },
  get warningRows() {
    return Object.entries(DB.warnings).filter(([id]) => CUR.state.has(Number(id))).map(([id, ws]) => ({
      key: id, id: Number(id), label: CUR.state.get(Number(id)).label, text: ws.map(w => w.warning).join(', ') }));
  },
  startSync(kind) {
    if (!this.has('drafter') || this.sync) return;
    const anchored = [...CUR.state.values()].filter(n => n.aphia_id != null).length;
    this.sync = { kind, done: 0, total: kind === 'sync_new' ? 3 : anchored };
    this.job = { text: 'WoRMS sync', done: 0, total: this.sync.total, retry: null };
    const tick = () => {
      const left = this.sync.total - this.sync.done;
      this.sync.done += Math.min(left, Math.max(1, Math.round(this.sync.total / 25)));
      this.job.done = this.sync.done;
      this.job.retry = this.sync.done > this.sync.total / 2 && this.sync.done < this.sync.total * 0.7
        ? { aphia: 149122, attempt: 2, pct: 40 } : null;
      if (this.sync.done < this.sync.total) setTimeout(tick, 120);
      else { this.sync = null; this.job = null; this.toast(`${kind} finished: pills and warnings refreshed`); }
    };
    setTimeout(tick, 120);
  },
  openOrg() { this.f = { error: '' }; this.modal = 'org'; },
  setMember(user, role) {
    const owners = this.members.filter(m => m.role === 'owner');
    if (role !== 'owner' && owners.length === 1 && owners[0].user === user) {
      this.f.error = 'The organization needs an owner: make someone else an owner first.';
      this.members = [...this.members];
      return;
    }
    this.f.error = '';
    this.members.find(m => m.user === user).role = role;
    this.toast(`${user} is now ${role}`);
  },

  // ---- tree navigation ---------------------------------------------------
  expandTop() {
    const h = history(this.treeId);
    const snap = h.snaps[h.snaps.length - 1];
    const exp = (this.exp[this.treeId] ||= {});
    for (const n of snap.values()) if (n.parent == null) exp[keyOf(n.id)] = true;
  },
  toggle(id) { const e = this.exp[this.treeId]; e[keyOf(id)] = !e[keyOf(id)]; this.refresh(); },
  expandAll() { const e = this.exp[this.treeId]; for (const id of CUR.kids.keys()) if (id != null) e[keyOf(id)] = true; this.refresh(); },
  collapseAll() { this.exp[this.treeId] = {}; this.refresh(); },
  rowClick(r) {
    if (this.pick) return this.pickTarget(r.id);
    if (r.hasKids) this.toggle(r.id);
  },
  reveal(id) {
    if (id == null || !CUR.state.has(id)) return;
    const e = this.exp[this.treeId];
    for (let n = CUR.state.get(CUR.state.get(id).parent); n; n = CUR.state.get(n.parent)) e[keyOf(n.id)] = true;
    this.refresh();
    this.$nextTick(() => document.getElementById('n-' + keyOf(id))?.scrollIntoView({ block: 'center', behavior: 'smooth' }));
  },
  toggleGroup(g) { this.collapsed[g] = !this.collapsed[g]; },
  selectTree(id) {
    this.treeId = id;
    this.viewRev = this.latest;
    this.collapsed = {};
    if (!this.exp[id]) this.expandTop();
    this.refresh();
  },
  selectRev(r) { this.viewRev = Number(r); this.collapsed = {}; this.refresh(); },
  onEscape() {
    if (this.conf) this.conf = null;
    else if (this.modal) this.closeModal();
    else if (this.menu) this.menu = null;
    else if (this.pick) { this.pick = null; this.refresh(); }
  },

  // ---- node menu ---------------------------------------------------------
  openMenu(r, ev) {
    const rect = ev.currentTarget.getBoundingClientRect();
    const n = CUR.state.get(r.id);
    const hint = this.editable ? (n.dep ? 'Deprecated in this draft' : '') : this.editHint;
    const aliasHint = !this.has('drafter') ? 'Needs drafter role' : isPh(r.id) ? 'Not published yet' : '';
    const items = [
      { key: 'details', text: 'Details…', fn: () => this.openDetails(r.id) },
      { key: 'description', text: 'Edit description…', hint: aliasHint, fn: () => this.openDescription(r.id) },
      { key: 'aliases', text: 'Edit aliases…', hint: aliasHint, fn: () => this.openAliases(r.id) },
      { key: 'd1', divider: true },
      { key: 'edit', text: 'Edit…', hint, fn: () => this.openEdit(r.id) },
      { key: 'child', text: 'New child…', hint, fn: () => this.openAdd(r.id) },
      { key: 'move', text: 'Move to…', hint, fn: () => this.startMove(r.id) },
      { key: 'split', text: 'Split…', hint, fn: () => this.openSplit(r.id) },
      { key: 'merge', text: 'Merge…', hint, fn: () => this.openMerge(r.id) },
      { key: 'd2', divider: true },
      { key: 'dep', text: 'Deprecate…', hint, fn: () => this.openDeprecate(r.id) },
    ];
    const h = 330, w = 250;
    const y = rect.bottom + h > window.innerHeight ? Math.max(8, rect.top - h) : rect.bottom;
    this.menu = { id: r.id, label: r.label, items, x: Math.min(rect.left, window.innerWidth - w - 8), y };
  },

  // ---- changes -----------------------------------------------------------
  addChanges(list) {
    this.cs.changes.push(...list);
    this.dirty = true;
    this.refresh();
  },
  removeChange(i) { this.cs.changes.splice(i, 1); this.dirty = true; this.refresh(); },
  removeGroup(g) { this.cs.changes = this.cs.changes.filter(c => c.group !== g); this.dirty = true; this.refresh(); },
  phAlloc() {
    let k = 0;
    for (const c of this.cs.changes) if (c.op === 'add' && isPh(c.node)) k = Math.max(k, Number(c.node.slice(4)));
    return () => `new:${++k}`;
  },
  nextGroup(prefix) {
    let n = 0;
    const all = [...Object.values(DB.changesets).filter(c => c.tree === this.treeId).flatMap(c => c.changes), ...this.cs.changes];
    for (const c of all) if (c.group?.startsWith(prefix + '#')) n = Math.max(n, Number(c.group.split('#')[1]));
    return `${prefix}#${n + 1}`;
  },
  labelError(label, self, extra = []) {
    if (!label) return 'Label is required';
    if (!LABEL_RE.test(label)) return 'Not machine-safe: no spaces or slashes, must start with a letter or digit';
    for (const n of CUR.state.values()) if (!n.dep && n.label === label && n.id !== self) return `Already used by ${n.id}`;
    if (extra.includes(label)) return 'Used twice here';
    return '';
  },
  aphiaError(a) { return a === '' || /^\d+$/.test(String(a)) ? '' : 'AphiaID must be a number'; },
  aphiaVal(a) { return a === '' || a == null ? null : Number(a); },

  // ---- draft lifecycle ---------------------------------------------------
  resetValidation() { this.validatedKey = null; this.unread = {}; this.tab = 'edited'; },
  startNewDraft() {
    this.resetValidation();
    this.cs = { id: null, tree: this.treeId, base_rev: this.latest || null, changes: [], notes: '', state: 'draft', author: 'you' };
    this.mode = 'edit';
    this.dirty = false;
    this.viewRev = this.latest;
    this.refresh();
  },
  openDraft(id) {
    this.resetValidation();
    this.cs = JSON.parse(JSON.stringify(DB.changesets[id]));
    this.mode = 'edit';
    this.dirty = false;
    this.collapsed = {};
    this.refresh();
  },
  exitEdit() {
    const go = () => { this.mode = 'static'; this.cs = null; this.dirty = false; this.pick = null; this.viewRev = this.latest; this.refresh(); };
    if (this.dirty) this.confirm('Leave without saving?', 'The unsaved changes in this draft will be lost.', 'Leave', 'btn-danger', go);
    else go();
  },
  saveDraft() {
    if (this.v.summary.errors && !this._confirmedSave) {
      return this.confirm('Save a draft with errors?', `This draft has ${this.v.summary.errors} structural errors. It can be saved, but it will not be publishable as it is.`,
        'Save anyway', 'btn-warning', () => { this._confirmedSave = true; this.saveDraft(); this._confirmedSave = false; });
    }
    if (!this.cs.id) {
      this.cs.id = DB.nextCs++;
      this.cs.created_at = new Date().toISOString().slice(0, 10);
    }
    DB.changesets[this.cs.id] = JSON.parse(JSON.stringify(this.cs));
    this.dirty = false;
    this.ver++;
    this.toast(`Draft #${this.cs.id} saved`);
  },
  discardDraft() {
    this.confirm(`Discard draft #${this.cs.id}?`, 'It is kept for the record, read-only, and can no longer be published.', 'Discard', 'btn-danger', () => {
      DB.changesets[this.cs.id].state = 'discarded';
      this.ver++;
      this.dirty = false;
      this.toast(`Draft #${this.cs.id} discarded`);
      this.exitEdit();
    });
  },
  rebase() { this.cs.base_rev = this.latest; this.dirty = true; this.refresh(); },
  openPublish() { this.f = { notes: this.cs.notes }; this.modal = 'publish'; },
  doPublish() {
    const cs = DB.changesets[this.cs.id];
    cs.notes = this.f.notes;
    cs.approver = 'you';
    publish(cs, new Date().toISOString().slice(0, 10));
    this.ver++;
    this.modal = null;
    this.mode = 'static';
    this.cs = null;
    this.viewRev = this.latest;
    this.collapsed = {};
    this.expandTop();
    this.refresh();
    this.toast(`Published revision ${this.latest}`);
  },
  openClone(kind = 'clone') { this.f = { kind, id: '', title: '', text: '', error: '' }; this.modal = 'clone'; },
  get cloneError() {
    if (!LABEL_RE.test(this.f.id || '')) return 'Use letters, digits, _ . -';
    if (DB.trees[this.f.id]) return 'A tree with this id exists';
    if (this.f.kind === 'import' && !this.f.text.trim()) return 'Paste an import file';
    return '';
  },
  doClone() {
    const id = this.f.id, src = CUR.state, kids = CUR.kids, kind = this.f.kind;
    const toNested = pid => (kids.get(pid) || []).filter(k => !src.get(k).dep).map(k => {
      const n = src.get(k);
      return { label: n.label, aphia_id: n.aphia_id, description: descOf(k, n), aliases: DB.aliases[k] || [], children: toNested(k) };
    });
    let nested = [];
    if (kind === 'clone') nested = toNested(null);
    if (kind === 'import') {
      try { nested = JSON.parse(this.f.text).nodes; } catch (e) { this.f.error = 'Not valid JSON: ' + e.message; return; }
      const bad = (list, path) => (list || []).map((n, i) => typeof n?.label !== 'string' ? `${path}[${i}]: node has no \`label\`` : bad(n.children, `${path}[${i}].children`)).find(Boolean);
      const problem = Array.isArray(nested) ? bad(nested, 'nodes') : 'file: expected an object with a `nodes` list';
      if (problem) { this.f.error = problem; return; }
    }
    DB.trees[id] = { id, title: this.f.title || id, revs: [] };
    const notes = { clone: `Clone of ${this.treeId} @ revision ${this.viewRev}`, import: 'Import of pasted JSON', empty: 'New tree' }[kind];
    const cs = { id: DB.nextCs++, tree: id, base_rev: null, changes: importChanges(nested, 'import#1'),
                 notes, state: 'draft', author: 'you',
                 created_at: new Date().toISOString().slice(0, 10) };
    DB.changesets[cs.id] = cs;
    this.ver++;
    this.modal = null;
    this.treeId = id;
    this.viewRev = 0;
    this.exp[id] = {};
    this.openDraft(cs.id);
    for (const c of cs.changes) if (c.parent == null) this.exp[id][keyOf(c.node)] = true;
    this.refresh();
    this.toast(`Created ${id} and draft #${cs.id}`);
  },

  // ---- setup wizard (a new instance; site admins only) -------------------
  openSetup() {
    this.f = { step: 1, orgId: '', orgName: '', org: null, users: [], username: '', role: 'owner', needsPw: false,
               pw: '', pw2: '', treeId: '', treeTitle: '', text: '', trees: [], error: '' };
    this.modal = 'setup';
  },
  setupOrg() {
    const f = this.f;
    if (!/^[-A-Za-z0-9_]+$/.test(f.orgId)) { f.error = 'The id must be a slug: letters, digits, _ and -'; return; }
    if (f.orgId === 'amplify') { f.error = 'Organization amplify already exists.'; return; }
    f.org = { id: f.orgId, name: f.orgName.trim() };
    f.step = 2;
    f.error = '';
  },
  setupAddUser() {
    const f = this.f, user = f.username.trim();
    const known = this.members.some(m => m.user === user);
    if (f.users.some(u => u.user === user)) { f.error = `${user} is already ${f.users.find(u => u.user === user).role}.`; return; }
    if (!known && !f.needsPw) { f.needsPw = true; f.error = ''; return; }
    if (f.needsPw && f.pw.length < 8) { f.error = 'This password is too short. It must contain at least 8 characters.'; return; }
    if (f.needsPw && f.pw !== f.pw2) { f.error = "The passwords don't match"; return; }
    f.users.push({ user, role: f.role, created: f.needsPw });
    Object.assign(f, { username: '', needsPw: false, pw: '', pw2: '', error: '', role: 'drafter' });
  },
  setupImport() {
    const f = this.f;
    let data;
    try { data = JSON.parse(f.text); } catch (e) { f.error = 'Not valid JSON: ' + e.message; return; }
    const labels = [];
    const walk = (nodes, path) => (nodes || []).forEach((n, i) => {
      if (typeof n?.label !== 'string') throw new Error(`${path}[${i}]: node has no \`label\``);
      labels.push(n.label);
      walk(n.children, `${path}[${i}].children`);
    });
    try { walk(data.nodes, 'nodes'); } catch (e) { f.error = e.message; return; }
    const dup = labels.find((l, i) => labels.indexOf(l) !== i);
    if (dup) { f.error = `${dup}: label is used twice`; return; }
    if (DB.trees[f.treeId] || f.trees.some(t => t.id === f.treeId)) { f.error = `Tree ${f.treeId} already exists.`; return; }
    f.trees.push({ id: f.treeId, title: f.treeTitle || f.treeId, nodes: labels.length });
    Object.assign(f, { treeId: '', treeTitle: '', text: '', error: '' });
  },
  /** Continue or Skip on Users: a username typed but not added would be lost, so ask. */
  setupLeaveUsers() {
    const f = this.f, name = f.username.trim();
    const go = () => { Object.assign(f, { step: 3, username: '', needsPw: false, pw: '', pw2: '', error: '' }); };
    if (!name) return go();
    this.confirm('Discard this user?', `${name} hasn't been added to the organization. Continue without adding them?`,
                 'Discard and continue', 'btn-warning', go);
  },
  setupSkip() {
    const f = this.f;
    if (f.step === 2) return this.setupLeaveUsers();
    if (f.step < 3) { f.step++; f.error = ''; return; }
    this.setupLeaveTrees(() => this.toast(`Skipping trees opens the organization page of ${f.org?.name ?? 'the organization'}`));
  },
  setupDone() { const first = this.f.trees[0].id; this.setupLeaveTrees(() => this.toast(`Done opens the first tree, ${first}`)); },
  /** Skip or Done on Trees: a tree typed but not imported would be lost, so ask. */
  setupLeaveTrees(then) {
    const f = this.f;
    const go = () => { this.closeModal(); then(); };
    if (![f.treeId, f.treeTitle, f.text].some(v => v.trim())) return go();
    this.confirm('Discard this tree?', `${f.treeId.trim() || 'This tree'} hasn't been imported. Leave without importing it?`,
                 'Discard and leave', 'btn-warning', go);
  },

  // ---- dialogs -----------------------------------------------------------
  closeModal() { this.modal = null; this.f = {}; },
  confirm(title, body, ok, cls, fn) { this.conf = { title, body, ok, cls, fn }; },
  toast(text, cls = 'text-bg-dark') {
    const t = { id: Math.random(), text, cls };
    this.toasts.push(t);
    setTimeout(() => (this.toasts = this.toasts.filter(x => x !== t)), 2500);
  },
  toggleSel(id) {
    const i = this.f.sel.indexOf(id);
    i < 0 ? this.f.sel.push(id) : this.f.sel.splice(i, 1);
  },
  pickerOptions(q, exclude = []) {
    const s = (q || '').toLowerCase();
    return this.v.options.filter(o => !exclude.includes(o.id) && (!s || o.label.toLowerCase().includes(s))).slice(0, 60);
  },

  openDetails(id) {
    const n = CUR.state.get(id), ev = CUR.ev;
    let version = `v${n.version}`;
    if (this.mode === 'edit' && ev.added.has(id)) version = 'v1 on publish';
    else if (this.mode === 'edit' && ev.bump.has(id)) version += ` → v${n.version + 1} on publish`;
    this.f = {
      label: n.label, aphia: n.aphia_id, warns: DB.warnings[id] || [],
      rows: [
        ['Id', String(id)],
        ['Tree', this.treeId],
        ['Path', nodePath(CUR.state, id) || '(top level)'],
        ['Version', version],
        ['Created in revision', n.created ?? 'this draft'],
        ['Description', descOf(id, n) || '—'],
        ['Aliases', (DB.aliases[id] || []).join(', ') || '—'],
        ['Children', String(this.liveKids(id).length)],
      ].concat(n.dep ? [['State', 'deprecated in this draft']] : []),
    };
    this.modal = 'details';
  },
  openDescription(id) { this.f = { id, text: descOf(id, CUR.state.get(id)) }; this.modal = 'description'; },
  saveDescription() {
    DB.descriptions[this.f.id] = this.f.text;
    this.toast(`Description of ${this.lbl(this.f.id)} saved`);
    this.closeModal();
    this.refresh();
  },
  openAliases(id) { this.f = { id, list: [...(DB.aliases[id] || [])], add: '' }; this.modal = 'aliases'; },
  saveAliases() {
    DB.aliases[this.f.id] = [...this.f.list];
    this.toast(`Aliases of ${this.lbl(this.f.id)} saved`);
    this.closeModal();
    this.refresh();
  },

  openAdd(parent) {
    const fixed = parent !== undefined;
    this.f = { mode: 'add', id: null, parent: fixed ? parent : null, parentFixed: fixed, parentKey: '',
               label: '', description: '', aphia: '', aliases: '' };
    this.modal = 'node';
  },
  openEdit(id) {
    const n = CUR.state.get(id);
    this.f = { mode: 'edit', id, orig: { ...n }, label: n.label, aphia: n.aphia_id ?? '' };
    this.modal = 'node';
  },
  get nodeFormError() {
    if (this.modal !== 'node') return '';
    return this.labelError(this.f.label, this.f.id) || this.aphiaError(this.f.aphia);
  },
  submitNode() {
    const f = this.f;
    if (f.mode === 'add') {
      const node = this.phAlloc()();
      const parent = f.parentFixed ? f.parent : idOf(f.parentKey);
      this.addChanges([{ op: 'add', node, label: f.label, parent, aphia_id: this.aphiaVal(f.aphia), description: f.description,
                         aliases: f.aliases.split(',').map(a => a.trim()).filter(Boolean) }]);
      if (parent != null) this.exp[this.treeId][keyOf(parent)] = true;
      this.closeModal();
      this.reveal(node);
      return;
    }
    const c = { op: 'edit', node: f.id };
    if (f.label !== f.orig.label) c.label = f.label;
    if (this.aphiaVal(f.aphia) !== (f.orig.aphia_id ?? null)) c.aphia_id = this.aphiaVal(f.aphia);
    if (Object.keys(c).length > 2) this.addChanges([c]);
    else this.toast('Nothing changed');
    this.closeModal();
  },

  startMove(id) { this.pick = { id, label: this.lbl(id) }; this.refresh(); },
  pickTarget(target) {
    const id = this.pick.id, n = CUR.state.get(id);
    if (target != null && (this.descendantsOf(id).has(target) || !this.live(target))) return;
    this.pick = null;
    if ((n.parent ?? null) === target) { this.toast('Already there'); this.refresh(); return; }
    this.addChanges([{ op: 'move', node: id, from_parent: n.parent, to_parent: target }]);
    if (target != null) this.reveal(id);
  },

  openDeprecate(id) { this.f = { id, kids: this.liveKids(id).length, sel: [], q: '' }; this.modal = 'deprecate'; },
  submitDeprecate() {
    this.addChanges([{ op: 'deprecate', node: this.f.id, successors: [...this.f.sel] }]);
    this.closeModal();
  },

  // ---- merge & split wizards ----------------------------------------------
  openMerge(id) {
    this.wizSteps = ['nodes', 'mode', 'new node', 'review'];
    this.f = { a: id, step: 1, sel: [], q: '', repl: true, survivorKey: keyOf(id),
               parts: [{ label: '', aphia: '', description: '' }], parentKey: '', preview: null };
    this.modal = 'merge';
  },
  openSplit(id) {
    this.wizSteps = ['mode', 'new nodes', 'children', 'review'];
    const kids = this.liveKids(id);
    this.f = { a: id, step: 1, repl: true, kids, assign: Object.fromEntries(kids.map(k => [keyOf(k), ''])),
               parts: [{ label: '', aphia: '', description: '' }, { label: '', aphia: '', description: '' }], preview: null };
    this.modal = 'split';
  },
  setRepl(on) {
    this.f.repl = on;
    if (this.modal === 'split') {
      const min = on ? 2 : 1;
      while (this.f.parts.length < min) this.f.parts.push({ label: '', aphia: '', description: '' });
      if (!on && this.f.parts.length === 2 && !this.f.parts[1].label) this.f.parts.pop();
    }
  },
  survivor() { return idOf(this.f.survivorKey); },
  mergeCandidates() {
    const a = this.f.a, s = (this.f.q || '').toLowerCase();
    const bad = this.descendantsOf(a);
    for (let n = CUR.state.get(CUR.state.get(a).parent); n; n = CUR.state.get(n.parent)) bad.add(n.id);
    const parent = CUR.state.get(a).parent;
    return this.v.options
      .filter(o => !bad.has(o.id) && (!s || o.label.toLowerCase().includes(s)))
      .sort((x, y) => (CUR.state.get(y.id).parent === parent) - (CUR.state.get(x.id).parent === parent))
      .slice(0, 80);
  },
  mergeParentOptions() {
    const bad = new Set();
    for (const id of [this.f.a, ...this.f.sel]) this.descendantsOf(id).forEach(x => bad.add(x));
    return this.v.options.filter(o => !bad.has(o.id));
  },
  commonParent(ids) {
    const chain = id => { const out = []; for (let p = CUR.state.get(id).parent; p != null; p = CUR.state.get(p).parent) out.push(p); return out; };
    const [first, ...rest] = ids.map(chain);
    return first.find(p => rest.every(c => c.includes(p))) ?? null;
  },
  partErrors() {
    const labels = this.f.parts.map(p => p.label);
    return this.f.parts.map((p, i) => this.labelError(p.label, null, labels.filter((_, j) => j !== i)) || this.aphiaError(p.aphia));
  },
  get wizError() {
    const f = this.f;
    if (this.modal === 'merge') {
      if (f.step === 1 && !f.sel.length) return 'Choose at least one node to merge with';
      if (f.step === 3 && f.repl) return this.partErrors()[0];
    }
    if (this.modal === 'split') {
      if (f.step === 2) return this.partErrors().find(Boolean) || '';
      if (f.step === 3 && f.repl && Object.values(f.assign).some(v => v === '')) return 'Assign every child';
    }
    return '';
  },
  wizNext() {
    const f = this.f;
    if (this.modal === 'merge' && f.step === 1 && f.parentKey === '') {
      const cp = this.commonParent([f.a, ...f.sel]);
      f.parentKey = keyOf(cp);
    }
    f.step++;
    if (f.step === 4) {
      const changes = this.modal === 'merge' ? this.mergeChanges() : this.splitChanges();
      const ev = applyChanges(CUR.state, changes);
      const offset = this.cs.changes.length;
      f.preview = {
        group: changes[0]?.group, changes,
        rows: changes.map((c, i) => ({ i: offset + i, op: c.op, text: describe(c, ev.results[i], ev.state),
                                      errors: ev.results[i].errors, warnings: ev.results[i].warnings })),
      };
    }
  },
  mergeChanges() {
    const f = this.f, g = this.nextGroup('merge'), ph = this.phAlloc(), out = [];
    const ids = [f.a, ...f.sel];
    let target;
    if (f.repl) {
      target = ph();
      const p = f.parts[0];
      out.push({ op: 'add', node: target, label: p.label, parent: idOf(f.parentKey), aphia_id: this.aphiaVal(p.aphia),
                 description: p.description, aliases: [], group: g });
    } else target = this.survivor();
    for (const x of ids) if (x !== target) for (const k of this.liveKids(x))
      out.push({ op: 'move', node: k, from_parent: x, to_parent: target, group: g });
    for (const x of ids) if (x !== target) out.push({ op: 'deprecate', node: x, successors: [target], group: g });
    return out;
  },
  splitChanges() {
    const f = this.f, g = this.nextGroup('split'), ph = this.phAlloc(), out = [];
    const parent = CUR.state.get(f.a).parent;
    const newIds = f.parts.map(p => {
      const id = ph();
      out.push({ op: 'add', node: id, label: p.label, parent, aphia_id: this.aphiaVal(p.aphia), description: p.description, aliases: [], group: g });
      return id;
    });
    for (const k of f.kids) {
      const a = f.assign[keyOf(k)];
      if (a !== '') out.push({ op: 'move', node: k, from_parent: f.a, to_parent: newIds[Number(a)], group: g });
    }
    if (f.repl) out.push({ op: 'deprecate', node: f.a, successors: newIds, group: g });
    return out;
  },
})));
</script>
