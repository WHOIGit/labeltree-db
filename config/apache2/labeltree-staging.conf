# Apache 2 reverse proxy for the staging host.
#
# Needs mod_ssl, mod_http2, mod_proxy, mod_proxy_http and mod_headers
# (a2enmod ssl http2 proxy proxy_http headers). Install as
# /etc/apache2/sites-available/labeltree-staging.conf and `a2ensite labeltree-staging`.
#
# Apache terminates TLS and serves /static/ itself; everything else goes to
# gunicorn, which compose yaml publishes on 127.0.0.1:8000 only, so
# nothing can reach it without passing through here. The container's
# collectstatic writes into /opt/labeltree/static (a bind mount).
#
# Django side (.env): DJANGO_BEHIND_TLS_PROXY=true,
# DJANGO_ALLOWED_HOSTS=labeltree-staging.whoi.edu and
# DJANGO_CSRF_TRUSTED_ORIGINS=https://labeltree-staging.whoi.edu.

<VirtualHost *:80>
    ServerName labeltree-staging.whoi.edu
    Redirect permanent / https://labeltree-staging.whoi.edu/
</VirtualHost>
<VirtualHost *:443>
    ServerName labeltree-staging.whoi.edu
    Protocols h2 http/1.1

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/ifcb-dashboard-staging.whoi.edu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ifcb-dashboard-staging.whoi.edu/privkey.pem

    ProxyPass /static !

    Alias /static /opt/labeltree/static
    <Directory /opt/labeltree/static>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8010/
    ProxyPassReverse / http://127.0.0.1:8010/

    ErrorLog ${APACHE_LOG_DIR}/labeltree-staging_error.log
    CustomLog ${APACHE_LOG_DIR}/labeltree-staging_access.log combined

    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
