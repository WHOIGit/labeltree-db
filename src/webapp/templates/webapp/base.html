{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}labeltree{% endblock %}</title>
  <link rel="icon" href="{% static 'app/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-5.3.8/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'app/app.css' %}">
  <script type="module" src="{% static 'app/main.js' %}"></script>
</head>
<body class="{% block body_class %}page{% endblock %}">
<nav class="topnav">
  <a class="brand" href="{% url 'home' %}">labeltree</a>
  {% block nav %}{% endblock %}
  <span class="flex-grow-1"></span>
  {% if user.is_authenticated %}
    <a href="{% url 'me' %}" class="me-2">{{ user.get_username }}</a>
    {% if user.is_superuser %}<a href="{% url 'admin:index' %}" class="me-2">Admin</a>{% endif %}
    <form method="post" action="{% url 'logout' %}" class="d-inline">
      {% csrf_token %}<button class="btn btn-sm btn-link p-0">Log out</button>
    </form>
  {% else %}
    <a class="btn btn-sm btn-outline-primary" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Log in to edit</a>
  {% endif %}
</nav>
{% block content %}{% endblock %}
</body>
</html>
